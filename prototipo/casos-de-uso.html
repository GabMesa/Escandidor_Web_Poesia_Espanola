<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casos de uso · Prototipo local</title><link rel="stylesheet" href="../identity.css"><link rel="stylesheet" href="prototipo.css"><style>.gallery{max-width:1250px;margin:40px auto;padding:0 25px}.screens{display:grid;grid-template-columns:1fr 1fr;gap:25px}.screens figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}.screens img{display:block;width:100%;height:auto}.screens figcaption{padding:20px}.screens h2{font-size:22px;margin-bottom:7px}.screens p{font-size:13px;color:var(--muted);margin:0}@media(max-width:750px){.screens{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="./">Mesa de Poesía<span>.</span></a><a href="./">Abrir prototipo →</a></header><main class="gallery"><p class="eyebrow">RECORRIDO VISUAL · CAPTURAS REALES DEL PROTOTIPO</p><h1>Del poema a la entrega.</h1><p class="subtitle" style="margin-bottom:30px">Estos casos se probaron en navegador con un perfil aislado. Los textos y los estados de participación son de demostración. Hacé clic en una imagen para verla completa.</p><div class="screens">
<figure><a href="../qa/prototipo/01-biblioteca.png"><img src="../qa/prototipo/01-biblioteca.png" alt="Biblioteca unificada con poemas, etiquetas e historial"></a><figcaption><h2>1. Organizar la biblioteca</h2><p>Tags por poema, búsqueda y selección para etiquetar en lote.</p></figcaption></figure>
<figure><a href="../qa/prototipo/02-filtro-tags.png"><img src="../qa/prototipo/02-filtro-tags.png" alt="Biblioteca filtrada por la etiqueta mar"></a><figcaption><h2>2. Encontrar poemas por tags</h2><p>Combinar etiquetas con todas o cualquiera de las seleccionadas.</p></figcaption></figure>
<figure><a href="../qa/prototipo/03-concursos.png"><img src="../qa/prototipo/03-concursos.png" alt="Lista de concursos guardados"></a><figcaption><h2>3. Guardar oportunidades</h2><p>Estado de participación, cierre y acceso a Escritores.org.</p></figcaption></figure>
<figure><a href="../qa/prototipo/04-importar-url.png"><img src="../qa/prototipo/04-importar-url.png" alt="Ficha con datos extraídos realmente de Escritores.org"></a><figcaption><h2>4. Pegar una URL y revisar</h2><p>Importación real de Manini Ríos: cierre detectado y fallo impreciso conservado como nota.</p></figcaption></figure>
<figure><a href="../qa/prototipo/05-seleccion-ultima-version.png"><img src="../qa/prototipo/05-seleccion-ultima-version.png" alt="Selección de poemas que sigue su última versión"></a><figcaption><h2>5. Asociar poemas a un concurso</h2><p>Última versión automática por defecto; opción de fijar una versión.</p></figcaption></figure>
<figure><a href="../qa/prototipo/06-exportar-citas.png"><img src="../qa/prototipo/06-exportar-citas.png" alt="Configuración de exportación con epígrafe en cursiva"></a><figcaption><h2>6. Preparar formato y citas</h2><p>DOCX, impresión / PDF, fuente, hoja, márgenes y epígrafes sin el marcador &gt;.</p></figcaption></figure>
<figure><a href="../qa/prototipo/07-confirmar-entrega.png"><img src="../qa/prototipo/07-confirmar-entrega.png" alt="Confirmación de las versiones entregadas"></a><figcaption><h2>7. Registrar lo enviado</h2><p>Revisar las versiones y conservar una copia exacta de la preparación.</p></figcaption></figure>
<figure><a href="../qa/prototipo/08-copia-entregada.png"><img src="../qa/prototipo/08-copia-entregada.png" alt="Copia de una entrega anterior que mantiene su texto"></a><figcaption><h2>8. Consultar una entrega anterior</h2><p>La copia conserva su texto y formato después de editar el poema.</p></figcaption></figure>
<figure><a href="../qa/prototipo/09-portada.png"><img src="../qa/prototipo/09-portada.png" alt="Portada del poemario con seudónimo y número de versos"></a><figcaption><h2>9. Añadir portada</h2><p>Título del conjunto, concurso, seudónimo y conteo separado del cuerpo de los poemas.</p></figcaption></figure>
<figure><a href="../qa/prototipo/10-recordatorios-resultados.png"><img src="../qa/prototipo/10-recordatorios-resultados.png" alt="Agenda con aviso de cierre y resultados de ejemplo"></a><figcaption><h2>10. Ver recordatorios y resultados</h2><p>Los concursos ficticios ilustran los avisos. Una fecha prevista no se presenta como una publicación confirmada.</p></figcaption></figure>
<figure><a href="../qa/prototipo/11-movil.png"><img src="../qa/prototipo/11-movil.png" alt="Vista móvil de concursos" style="max-width:390px;margin:auto"></a><figcaption><h2>11. Usarlo desde el teléfono</h2><p>Diseño adaptable, sin desbordamiento horizontal.</p></figcaption></figure>
<figure><a href="../qa/prototipo/12-escandidor-taller.png"><img src="../qa/prototipo/12-escandidor-taller.png" alt="Escandidor integrado como una pestaña del Taller"></a><figcaption><h2>12. Escribir en Escandidor</h2><p>Un solo editor, con textos, configuración, rimas y definiciones.</p></figcaption></figure>
<figure><a href="../qa/prototipo/13-biblioteca-gestor.png"><img src="../qa/prototipo/13-biblioteca-gestor.png" alt="Gestor de archivos completo dentro de Biblioteca"></a><figcaption><h2>13. Gestionar archivos desde Biblioteca</h2><p>Versiones, vista previa, renombrado, descargas, compresión, colores, fuentes y papelera en una misma vista.</p></figcaption></figure>
<figure><a href="../qa/prototipo/14-plica-declaracion-ia.png"><img src="../qa/prototipo/14-plica-declaracion-ia.png" alt="Plica con datos guardados y declaración de IA editable"></a><figcaption><h2>14. Guardar la plica y su declaración</h2><p>Perfil reutilizable entre concursos en SQLite local; declaración de IA opcional y editable.</p></figcaption></figure>
<figure><a href="../qa/prototipo/15-papelera-biblioteca.png"><img src="../qa/prototipo/15-papelera-biblioteca.png" alt="Papelera integrada en Biblioteca"></a><figcaption><h2>15. Recuperar poemas y versiones</h2><p>Papelera integrada, restauración y preferencias de limpieza.</p></figcaption></figure>
<figure><a href="../qa/prototipo/16-historial-biblioteca.png"><img src="../qa/prototipo/16-historial-biblioteca.png" alt="Historial y vista previa junto a la lista de poemas"></a><figcaption><h2>16. Revisar el historial sin salir</h2><p>Elegir versión, leerla, renombrarla, descargarla o abrirla en Escandidor.</p></figcaption></figure>
<figure><a href="../qa/prototipo/17-preferencias-biblioteca.png"><img src="../qa/prototipo/17-preferencias-biblioteca.png" alt="Preferencias de fuente, color y compresión"></a><figcaption><h2>17. Ajustar las preferencias</h2><p>Fuente y color predeterminados, compresión automática y acceso a sincronización.</p></figcaption></figure>
<figure><a href="../qa/prototipo/18-previsualizacion-paginas.png"><img src="../qa/prototipo/18-previsualizacion-paginas.png" alt="Dos poemas en hojas separadas, numeradas al pie"></a><figcaption><h2>18. Previsualizar las páginas</h2><p>Un poema por hoja y numeración al pie cuando se activan estas opciones. La portada cuenta como primera página.</p></figcaption></figure>
<figure><a href="../qa/prototipo/19-avisos-navegador.png"><img src="../qa/prototipo/19-avisos-navegador.png" alt="Recordatorios con avisos del navegador activados y descarga manual para calendario"></a><figcaption><h2>19. Activar avisos del navegador</h2><p>Notificaciones mientras el taller esté abierto. Descarga manual del evento para Google Calendar, sin conectar cuentas.</p></figcaption></figure>
<figure><a href="../qa/prototipo/20-crear-etiquetas.png"><img src="../qa/prototipo/20-crear-etiquetas.png" alt="20. Crear etiquetas antes de usarlas"></a><figcaption><h2>20. Crear etiquetas antes de usarlas</h2><p>El catálogo conserva etiquetas con cero poemas. Podés renombrarlas o eliminarlas.</p></figcaption></figure>
<figure><a href="../qa/prototipo/21-asignar-etiquetas.png"><img src="../qa/prototipo/21-asignar-etiquetas.png" alt="21. Asignar etiquetas con un botón"></a><figcaption><h2>21. Asignar etiquetas con un botón</h2><p>Elegí las etiquetas con casillas y presioná Aplicar etiquetas.</p></figcaption></figure>
<figure><a href="../qa/prototipo/22-biblioteca-versiones.png"><img src="../qa/prototipo/22-biblioteca-versiones.png" alt="22. Gestionar versiones desde Biblioteca"></a><figcaption><h2>22. Gestionar versiones desde Biblioteca</h2><p>Seleccionar versiones concretas, previsualizar, abrir, descargar o enviar a papelera. Incluye descargas de historial y operaciones entre distintos poemas.</p></figcaption></figure>
<figure><a href="../qa/prototipo/23-barra-lateral-compacta.png"><img src="../qa/prototipo/23-barra-lateral-compacta.png" alt="23. Contraer la barra lateral"></a><figcaption><h2>23. Contraer la barra lateral</h2><p>Iconos y más espacio para trabajar. La preferencia se conserva al recargar.</p></figcaption></figure>
<figure><a href="../qa/prototipo/24-taller-movil.png"><img src="../qa/prototipo/24-taller-movil.png" alt="24. Escribir desde el Taller en móvil"></a><figcaption><h2>24. Escribir desde el Taller en móvil</h2><p>La misma identidad visual y acceso al Escandidor desde el Taller.</p></figcaption></figure>
<figure><a href="../qa/prototipo/25-selector-color-compartido.png"><img src="../qa/prototipo/25-selector-color-compartido.png" alt="Selector de color compartido entre Biblioteca y Escandidor"></a><figcaption><h2>El mismo color en todo el taller</h2><p>La paleta de Escandidor también en Biblioteca, con color personalizado e intensidad del fondo.</p></figcaption></figure><figure><a href="../qa/prototipo/26-concurso-tags-y-agenda.png"><img src="../qa/prototipo/26-concurso-tags-y-agenda.png" alt="Etiquetar desde el concurso"></a><figcaption><h2>Etiquetar desde el concurso</h2><p>Agregá etiquetas a los poemas y gestioná la agenda desde la ficha.</p></figcaption></figure><figure><a href="../qa/prototipo/27-fuera-de-agenda.png"><img src="../qa/prototipo/27-fuera-de-agenda.png" alt="Pausar un concurso"></a><figcaption><h2>Pausar un concurso</h2><p>Quitarlo de la agenda conserva sus datos y detiene sus avisos. Podés volver a agregarlo.</p></figcaption></figure><figure><a href="../qa/prototipo/28-eliminar-concurso.png"><img src="../qa/prototipo/28-eliminar-concurso.png" alt="Eliminar con confirmación"></a><figcaption><h2>Eliminar con confirmación</h2><p>Se borran el concurso y sus copias de entrega. Biblioteca y la plica del usuario se conservan.</p></figcaption></figure></div></main></body></html>
