<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validación del importador · Taller</title><link rel="stylesheet" href="../identity.css"><link rel="stylesheet" href="prototipo.css"><style>main{max-width:1100px;margin:40px auto;padding:0 25px}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px;overflow-wrap:anywhere}th{color:var(--muted);font-weight:500}.source{font-size:12px}.report{margin-top:25px}</style></head><body><header class="topbar"><a class="brand" href="./">Mesa de Poesía<span>.</span></a><a href="./">Volver al Taller →</a></header><main><p class="eyebrow">PRUEBAS CON CONVOCATORIAS REALES</p><h1>Qué pudo detectar el importador.</h1><p class="muted">Se compararon campos concretos de seis convocatorias. Los datos no detectados y las secciones en imágenes siguen necesitando revisión personal.</p><div id="report" class="report" role="status">Cargando informe…</div></main><script type="module">
import {escapeHtml as h} from './model.js';
const labels={deadline:'Cierre',deadlineTime:'Hora de cierre',resultsDate:'Fecha exacta del fallo',maxPoems:'Máximo de poemas',minPoemVerses:'Mínimo de versos por poema',maxVerses:'Máximo de versos por poema',minTotal:'Mínimo de versos del conjunto',maxTotal:'Máximo de versos del conjunto',plicaRequired:'Plica admitida / requerida',verseCounting:'Conteo especial'};
const value=v=>v===''?'No se asigna una fecha exacta':v===true?'Sí':v===false?'No':v==='includes-title-and-blanks'?'Incluye título y espacios entre estrofas':String(v);
try{const r=await fetch('../qa/prototipo/importaciones/informe.json');if(!r.ok)throw Error('Informe no disponible');const data=await r.json();document.querySelector('#report').innerHTML=data.cases.map(c=>`<article class="panel"><h2>${h(c.name||c.id)}</h2><a class="source" href="${h(c.sourceUrl)}" target="_blank" rel="noopener noreferrer">Ver convocatoria fuente ↗</a><table><thead><tr><th>Campo comprobado</th><th>Valor esperado</th><th>Valor detectado</th><th>Resultado</th></tr></thead><tbody>${(c.checks||[]).map(f=>`<tr><td>${h(labels[f.field]||f.field)}</td><td>${h(value(f.expected))}</td><td>${h(value(f.actual))}</td><td>${f.pass?'✓ Correcto':'Revisar'}</td></tr>`).join('')}</tbody></table>${(c.pdfRead||[]).map(p=>`<p class="hint">${p.ok?'Se leyó el texto del PDF.':'No se pudo leer el PDF.'} ${p.imagePages?'Contiene secciones en imágenes: la cobertura es parcial.':''}</p>`).join('')}<p class="hint">${c.detected?Object.entries({font:'Fuente',size:'Tamaño',paper:'Hoja',lineSpacing:'Interlineado'}).filter(([key])=>!c.detected[key]).map(([,label])=>label).join(', ')+' no detectados: los valores de exportación son sugerencias.':''}</p></article>`).join('');}catch(e){document.querySelector('#report').textContent=e.message;}
</script></body></html>
