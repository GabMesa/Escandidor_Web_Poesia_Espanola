<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de Poesía · El hogar de tus versos</title>
<style>
:root{--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--hand:'Segoe Print','Bradley Hand','Comic Sans MS',cursive;--ui:system-ui,-apple-system,'Segoe UI',sans-serif}
body{--wall:#efe5d3;--wall2:#e6d8bf;--ink:#2f2219;--quiet:#76624c;--line:#d8c5a5;--paper:#fbf6ec;--plank1:#e8c48e;--plank2:#d7aa6f;--plank-ink:#2c1a0d;--plank-edge:#a87843;--bench1:#b98552;--bench2:#a6713d;--bench-edge:#76491f;--peg:#c9a77b;--accent:#b5532f;--on-accent:#fff;--ok:#3f6b4a;--bad:#b23a26;--rule:#ecc94b;--plate:#caa14a;--roof:#9c4a30;--frame:#7b5232;--glow:transparent}
body.noche{--wall:#1c1714;--wall2:#251e19;--ink:#f2e7d7;--quiet:#bba78f;--line:#40342a;--paper:#2a221c;--plank1:#c79762;--plank2:#b07e48;--plank-ink:#1f1108;--plank-edge:#6f4826;--bench1:#5e3e28;--bench2:#4b301e;--bench-edge:#2a1a0f;--peg:#3a2d23;--accent:#eba44f;--on-accent:#24160a;--ok:#93cf9f;--bad:#ff8a73;--rule:#cfae3f;--plate:#b98f3f;--roof:#6d3322;--frame:#4a301d;--glow:#ffcf7a}
*{box-sizing:border-box}html{background:var(--wall)}body{margin:0;background:var(--wall);color:var(--ink);font:15px/1.5 var(--ui);transition:background .3s,color .3s}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-size:14px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:default}
.eyebrow{font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--quiet);margin:0 0 12px}
/* top bar */
.top{display:flex;align-items:center;gap:18px;padding:16px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--wall) 92%,transparent);backdrop-filter:blur(6px);z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;text-align:left}.brand b{font:600 22px var(--serif);letter-spacing:-.02em}.brand small{font:italic 13px var(--serif);color:var(--quiet)}
.top nav{display:flex;gap:4px;margin-left:auto}.top nav button{background:none;border:0;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--quiet)}.top nav button[aria-current=page]{background:var(--wall2);color:var(--ink);font-weight:600}
.theme-toggle{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
main{min-height:calc(100vh - 70px)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--wall);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
/* HOME */
.home-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,70px);align-items:center;padding:clamp(36px,6vw,80px) clamp(18px,5vw,64px) 40px;max-width:1240px;margin:auto;overflow-x:clip}
.home-hero>*{min-width:0}
.home-hero h1{font:normal clamp(44px,6.4vw,84px)/1 var(--serif);letter-spacing:-.04em;margin:0 0 22px}.home-hero h1 em{color:var(--accent)}
.lead{font-size:17px;line-height:1.7;color:var(--quiet);max-width:470px;margin:0 0 28px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.house{position:relative;max-width:470px;width:100%;margin:auto;padding-top:24px}
.roof{position:relative;height:clamp(90px,12vw,130px);background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);margin:0 -14px}
.roof:after{content:'';position:absolute;left:44%;top:46%;width:12%;aspect-ratio:1;border-radius:50%;background:var(--wall);box-shadow:inset 0 0 0 4px var(--frame),0 0 30px var(--glow)}
.chimney{position:absolute;right:20%;top:10px;width:30px;height:70px;background:var(--frame);z-index:-1}
.smoke{position:absolute;right:calc(20% + 4px);top:-26px;width:22px;height:22px;border-radius:50%;background:var(--line);opacity:.6;animation:smoke 5s infinite ease-out}.smoke.s2{animation-delay:2.5s}
@keyframes smoke{0%{transform:translate(0,30px) scale(.5);opacity:0}30%{opacity:.6}100%{transform:translate(-30px,-40px) scale(1.6);opacity:0}}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--frame);padding:10px;border-radius:0 0 6px 6px}
.room{position:relative;text-align:left;min-height:150px;border:0;border-radius:4px;padding:16px;background:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;transition:transform .2s}
.room:hover{transform:translateY(-2px)}
body.noche .room{background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--glow) 22%,transparent),transparent 70%),var(--paper)}
.room svg{position:absolute;top:14px;right:14px;width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.room b{font:600 18px var(--serif)}.room small{font-size:12px;color:var(--quiet);line-height:1.4}
.room .tag{position:absolute;top:16px;left:16px;font:600 9px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--quiet)}
.room.main{background:linear-gradient(var(--paper),var(--paper)) padding-box}
.room.main:before{content:'';position:absolute;left:16px;right:72px;top:36px;height:30px;background:linear-gradient(var(--plank1),var(--plank2));-webkit-mask:linear-gradient(#000 0 7px,transparent 7px 11px,#000 11px 18px,transparent 18px 22px,#000 22px 29px,transparent 0);mask:linear-gradient(#000 0 7px,transparent 7px 11px,#000 11px 18px,transparent 18px 22px,#000 22px 29px,transparent 0);border-radius:2px}
.ground{height:10px;background:var(--line);border-radius:0 0 8px 8px;margin:0 -24px}
.home-band{max-width:1240px;margin:0 auto;padding:30px clamp(18px,5vw,64px) 60px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.continue h2{font:normal 30px/1.1 var(--serif);margin:0 0 6px}.continue p{color:var(--quiet);margin:0 0 18px;font-size:14px}
.mini-bench{border-radius:8px;padding:14px;background:linear-gradient(var(--bench1),var(--bench2));border-bottom:8px solid var(--bench-edge);margin-bottom:18px;display:grid;gap:6px}
.mini-plank{height:26px;border-radius:2px;background:repeating-linear-gradient(92deg,#0000 0 7px,#00000010 7px 8px),linear-gradient(var(--plank1),var(--plank2));color:var(--plank-ink);font:13px/26px var(--serif);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 var(--plank-edge)}
.steps{display:grid;gap:14px}.step{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:start}.step svg{width:46px;height:46px;padding:10px;border-radius:12px;background:var(--wall2);stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.step b{display:block;font:600 17px var(--serif)}.step span{font-size:13px;color:var(--quiet)}
.shelf-preview{grid-column:1/-1}
.foot{border-top:1px solid var(--line);padding:22px clamp(18px,5vw,64px);display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;font-size:12px;color:var(--quiet)}
/* LIBRARY */
.library{max-width:1100px;margin:auto;padding:40px clamp(18px,5vw,60px) 60px}
.library h1,.shop-title h1{font:normal clamp(34px,4.5vw,54px)/1.05 var(--serif);letter-spacing:-.03em;margin:0 0 8px}
.library>p{color:var(--quiet);margin:0 0 30px}
.bookcase{background:var(--frame);padding:14px;border-radius:8px;box-shadow:inset 0 0 0 3px color-mix(in srgb,#000 15%,var(--frame))}
.shelf{display:flex;align-items:flex-end;gap:6px;min-height:210px;padding:16px 18px 0;background:linear-gradient(color-mix(in srgb,#000 22%,var(--wall2)),var(--wall2) 30%);border-bottom:16px solid var(--bench2);box-shadow:0 6px 0 var(--bench-edge);margin-bottom:22px;overflow-x:auto}
.shelf:last-child{margin-bottom:6px}
.spine{flex:none;width:58px;border:0;border-radius:3px 3px 0 0;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;color:#fff8ec;box-shadow:inset -6px 0 10px #0000002e,inset 3px 0 0 #ffffff22;transition:transform .2s;position:relative}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 13.5px var(--serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:130px}
.spine small{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:52px}
.spine:before{content:'';position:absolute;left:8px;right:8px;top:8px;height:2px;background:#ffffff55}
.spine.deco{cursor:default;opacity:.55}.spine.deco:hover{transform:none}
.spine.new{background:transparent;border:2px dashed var(--quiet);color:var(--quiet);box-shadow:none}
.lean{transform:rotate(-8deg);transform-origin:bottom left;margin-left:14px}.lean:hover{transform:rotate(-8deg) translateY(-6px)}
.plaque{display:inline-block;background:linear-gradient(135deg,color-mix(in srgb,#fff 25%,var(--plate)),var(--plate));color:#2a1d07;border-radius:3px;padding:3px 10px;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 1px 0 #0003;margin:0 0 10px}
/* SHOP */
.shop{position:relative;padding:22px clamp(14px,3vw,40px) 50px;max-width:1360px;margin:auto}
body.noche .shop:before{content:'';position:absolute;left:50%;top:-40px;width:900px;max-width:100%;height:520px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--glow) 18%,transparent),transparent 65%);pointer-events:none}
.shop-title{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px;position:relative}
.shop-title>p{margin:0;color:var(--quiet);font-size:14px}
.pegboard{position:relative;display:flex;gap:10px;padding:20px 18px 16px;border-radius:10px 10px 0 0;background:radial-gradient(circle,rgba(0,0,0,.3) 2px,transparent 2.6px) 0 0/22px 22px,var(--peg);border:8px solid var(--frame);border-bottom:0;overflow-x:auto}
.tool{flex:none;position:relative;width:96px;height:96px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:0 0 8px;border-radius:10px;color:var(--ink);transition:transform .2s}
.tool:before{content:'';position:absolute;top:2px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--metal,#6a6f75);box-shadow:0 1px 0 #0005}
.tool svg{width:48px;height:48px;stroke:var(--ink);fill:color-mix(in srgb,var(--paper) 70%,transparent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(2px 3px 0 #00000026);transition:transform .2s}
.tool span{font:600 11px var(--ui);background:var(--paper);border-radius:4px;padding:2px 7px;box-shadow:0 1px 0 #0002}
.tool:hover svg{transform:translateY(-3px) rotate(-4deg)}
.tool[aria-pressed=true]{background:color-mix(in srgb,var(--paper) 55%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.tool[aria-pressed=true] svg{transform:translateY(-4px) rotate(-8deg);stroke:var(--accent)}
.tool[aria-pressed=true] span{background:var(--accent);color:var(--on-accent)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0;border:8px solid var(--frame);border-top:0;border-radius:0 0 12px 12px;background:var(--frame)}
.bench{min-width:0;padding:20px 20px 24px;background:repeating-linear-gradient(91deg,#00000008 0 2px,#0000 2px 11px),repeating-linear-gradient(89deg,#ffffff0d 0 1px,#0000 1px 23px),linear-gradient(var(--bench1),var(--bench2));border-bottom:16px solid var(--bench-edge);position:relative}
.bench-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.nameplate{background:linear-gradient(135deg,color-mix(in srgb,#fff 28%,var(--plate)),var(--plate) 60%,color-mix(in srgb,#000 12%,var(--plate)));border-radius:4px;padding:6px 12px;box-shadow:0 2px 0 #0004,inset 0 1px 0 #fff6;display:flex;flex-direction:column;min-width:0;max-width:100%}
.nameplate input{border:0;background:transparent;font:600 19px var(--serif);color:#2a1d07;padding:0;width:min(320px,60vw);min-width:0}
.nameplate input:focus-visible{outline:2px solid #2a1d07;outline-offset:2px}
.nameplate small{font-size:10px;color:#4a3816;letter-spacing:.08em}
.square{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.square>span{font:600 11px var(--ui);color:#fff3e0;margin-right:4px;text-shadow:0 1px 0 #0006}
.chip{border:1px solid #0000;background:color-mix(in srgb,var(--paper) 88%,transparent);border-radius:999px;padding:5px 11px;font-size:12px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.undo{background:var(--paper);border:0;border-radius:999px;padding:5px 11px;font-size:12px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) 74px;gap:10px;align-items:center}
.ruler-row{margin-bottom:10px}
.ruler{display:flex;height:26px;background:var(--rule);border-radius:2px;box-shadow:0 2px 0 #0004;overflow:hidden}
.ruler i{flex:1;border-right:1px solid #3a2a0a;position:relative;font-style:normal}
.ruler i:before{content:'';position:absolute;left:50%;top:0;height:6px;border-left:1px solid #3a2a0a}
.ruler i b{position:absolute;bottom:2px;right:3px;font:600 10px var(--ui);color:#2a1d07}
.ruler i:nth-child(4n){background:color-mix(in srgb,#000 6%,var(--rule))}
.planks{display:grid;gap:10px;position:relative}
.plank-row{width:100%;border:0;background:transparent;padding:0;text-align:left;color:inherit;border-radius:6px}
.vnum{font:600 12px var(--ui);color:#fff3e0;text-align:right;text-shadow:0 1px 0 #0006}
.track{position:relative;display:block;min-height:58px}
.track:after{content:'';position:absolute;top:-6px;bottom:-6px;left:var(--sq);border-left:2px solid var(--accent);display:var(--sqd,block);z-index:2;pointer-events:none}
.plank{position:relative;display:flex;flex-direction:column;min-height:58px;background:repeating-linear-gradient(92deg,#0000 0 6px,#00000012 6px 7px,#0000 7px 19px),repeating-linear-gradient(88deg,#ffffff1c 0 1px,#0000 1px 31px),linear-gradient(var(--plank1),var(--plank2));border-radius:3px;box-shadow:0 3px 0 var(--plank-edge),0 6px 8px #0000002e;transition:transform .2s,box-shadow .2s;color:var(--plank-ink);min-width:0}
.plank-row:hover .plank{transform:translateY(-1px)}
.plank-row.on .plank{transform:translateY(-3px);box-shadow:0 3px 0 var(--plank-edge),0 12px 18px #00000040,0 0 0 3px var(--accent)}
.ptext{flex:1;padding:8px 12px 4px;font:17px/1.35 var(--serif);overflow-wrap:anywhere}
.marks{display:flex;border-top:1px solid #00000022;height:24px}
.cell{flex:1;min-width:0;position:relative;font:10px/26px var(--ui);text-align:center;color:color-mix(in srgb,var(--plank-ink) 75%,transparent);border-right:1px solid #00000020;overflow:hidden;white-space:nowrap;text-overflow:clip}
.cell:last-child{border-right:0}
.cell.tonic{font-weight:700;color:var(--plank-ink)}
.cell.tonic:after{content:'';position:absolute;top:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e2e6eb,#585d64);box-shadow:0 1px 0 #0005}
.cell.ghost{background:repeating-linear-gradient(45deg,#0000 0 4px,#00000014 4px 6px)}
.cell.over{background:color-mix(in srgb,var(--bad) 26%,transparent);color:var(--plank-ink)}
.missing{position:absolute;top:0;height:62px;border:2px dashed color-mix(in srgb,#fff 55%,transparent);border-left:0;border-radius:0 3px 3px 0;display:flex;align-items:center;justify-content:center;font:600 10px var(--ui);color:#fff3e0;text-shadow:0 1px 0 #0006;pointer-events:none}
.stamps{display:flex;align-items:center;gap:6px}
.count{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--ui);background:#2b190c;color:#f4dfc0;box-shadow:inset 0 0 0 2px #00000055}
.count.ok{background:var(--ok);color:#fff}.count.off{background:var(--bad);color:#fff}
body.noche .count.ok,body.noche .count.off{color:#1b120a}
.rmark{font:italic 700 16px var(--serif);color:#fff3e0;text-shadow:0 1px 0 #0006;min-width:12px}
.pencil{font-style:normal;color:#fff3e0;font-size:14px}
.stanza-gap{height:6px}
.bench-status{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;font:12px var(--ui);color:#fff3e0;text-shadow:0 1px 0 #0006}.bench-status b{font-size:14px}
.empty-bench{padding:40px 20px;text-align:center;color:#fff3e0;font:italic 18px var(--serif);text-shadow:0 1px 0 #0006}
.panel{background:var(--paper);padding:22px;min-width:0;border-left:1px solid var(--line)}
.panel h2{font:normal 26px/1.1 var(--serif);margin:0 0 4px}.panel .how{font:italic 14px var(--serif);color:var(--quiet);margin:0 0 18px}
.panel h3{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--quiet);margin:20px 0 8px}
.big{display:flex;align-items:baseline;gap:10px}.big strong{font:normal 54px/1 var(--serif);color:var(--accent)}.big span{font-size:13px;color:var(--quiet)}
.verdict{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--wall2);font-size:13px}.verdict.ok{border-left:4px solid var(--ok)}.verdict.off{border-left:4px solid var(--bad)}
.chain{display:flex;flex-wrap:wrap;gap:4px}.chain span{background:var(--wall2);border-radius:4px;padding:4px 7px;font:13px var(--serif)}.chain span.tonic{background:var(--accent);color:var(--on-accent)}.chain span.ghost{background:transparent;border:1px dashed var(--quiet);color:var(--quiet);font:11px var(--ui)}
.facts{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;font-size:13px}.facts li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:5px}.facts b{font-weight:600}
.level{position:relative;height:44px;border-radius:22px;background:linear-gradient(#2d6b4a,#3f8a5f);box-shadow:inset 0 3px 6px #0005;margin:6px 0 10px;overflow:hidden}
.level:before,.level:after{content:'';position:absolute;top:6px;bottom:6px;border-left:2px solid #fff8;left:calc(50% - 26px)}.level:after{left:calc(50% + 24px)}
.bubble{position:absolute;top:9px;width:46px;height:26px;border-radius:13px;background:radial-gradient(circle at 35% 35%,#fff,#d8f1e1 60%,#a5d3b7);left:calc(50% - 23px + var(--off,0px));transition:left .4s cubic-bezier(.3,1.6,.5,1)}
.accents{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}.accents i{width:22px;height:26px;border-radius:4px;background:var(--wall2);font:600 10px/26px var(--ui);text-align:center;font-style:normal;color:var(--quiet)}.accents i.hit{background:var(--ink);color:var(--paper)}.accents i.need{box-shadow:inset 0 0 0 2px var(--accent)}.accents i.need.hit{background:var(--ok);color:#fff;box-shadow:none}
.words{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.word{border:1px solid var(--line);background:var(--wall2);border-radius:6px;padding:6px 10px;font:15px var(--serif)}
.word:hover{background:var(--paper);border-color:var(--accent);text-decoration:line-through;text-decoration-color:var(--accent)}
.saw-words .word{cursor:default}.saw-words .word:hover{text-decoration:none;background:var(--wall2);border-color:var(--line)}
.cut{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:6px;width:30px;height:30px;padding:0;font-size:14px}.cut:hover{background:var(--accent);color:var(--on-accent)}
.rhymes{display:flex;flex-wrap:wrap;gap:6px}.rhymes button{border:1px solid var(--line);background:var(--wall2);border-radius:999px;padding:5px 11px;font:14px var(--serif)}.rhymes button:hover{border-color:var(--accent)}.rhymes.soft button{background:transparent}
.field{width:100%;border:1px solid var(--line);background:var(--wall);border-radius:8px;padding:10px;font:14px var(--ui)}
textarea.field{min-height:90px;resize:vertical;font:16px/1.5 var(--hand)}
.notes{list-style:none;padding:0;margin:0;display:grid;gap:8px}.notes li{font:14px/1.4 var(--hand);background:var(--wall2);border-radius:6px;padding:8px 10px}.notes b{font:600 11px var(--ui);color:var(--accent);margin-right:6px}

.panel .btn{margin-top:10px}
.below{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.drawer{background:linear-gradient(var(--bench2),var(--bench-edge));border-radius:10px;padding:16px 18px;color:#fff3e0;box-shadow:inset 0 10px 16px #0004}
.drawer h3{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}.drawer p{margin:0 0 12px;font-size:12px;opacity:.85}
.shavings{display:flex;flex-wrap:wrap;gap:8px}

.raw{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 16px}
.raw summary{cursor:pointer;padding:14px 0;font-weight:600;font-size:14px}
.raw textarea{width:100%;min-height:170px;border:1px solid var(--line);background:var(--wall);border-radius:8px;padding:12px;font:17px/1.7 var(--serif);resize:vertical;margin-bottom:14px}

function syllabify(orig,w,nuc){if(nuc.length<2)return [orig];const cuts=[];for(let k=0;k<nuc.length-1;k++){const a=nuc[k].e,b=nuc[k+1].s,cl=w.slice(a,b),units=[];for(let j=0;j<cl.length;j++){const two=cl.slice(j,j+2);if(['ch','ll','rr'].includes(two)){units.push(two);j++}else if(cl[j]==='u'&&units.length)units[units.length-1]+='u';else units.push(cl[j])}let left=0;const n=units.length;if(n===2&&!CLUSTERS.has(units[0]+units[1]))left=1;else if(n===3)left=CLUSTERS.has(units[1]+units[2])?1:2;else if(n>=4)left=2;let len=0;for(let j=0;j<left;j++)len+=units[j].length;cuts.push(a+len)}const out=[];let p=0;cuts.forEach(c=>{out.push(orig.slice(p,c));p=c});out.push(orig.slice(p));return out}

function paintPlanks(){const box=document.getElementById('planks');if(!box)return;const ls=lines(),an=ls.map(analyze),sc=schemeFor(an),t=S.target,max=Math.max(0,...an.map(a=>a?a.count:0)),N=Math.min(22,Math.max(12,t+2,max+1)),bench=box.closest('.bench');bench.style.setProperty('--sq',(t/N*100)+'%');bench.style.setProperty('--sqd',t?'block':'none');if(!an.some(Boolean)){box.innerHTML='<p class="empty-bench">Banco vacío. Escribí tu primer verso en «Desarmar en texto».</p>';return}
 const filled=an.filter(Boolean),ok=filled.filter(a=>!t||a.count===t).length;
 box.innerHTML=`<div class="row ruler-row" aria-hidden="true"><span></span><div class="ruler">${Array.from({length:N},(_,k)=>`<i><b>${k+1}</b></i>`).join('')}</div><span></span></div><div class="planks">${ls.map((l,i)=>{const a=an[i];if(!a)return '<div class="stanza-gap" aria-hidden="true"></div>';const st=!t?'':a.count===t?'ok':'off',short=t&&a.count<t;return `<button class="row plank-row ${i===S.sel?'on':''}" data-line="${i}" aria-pressed="${i===S.sel}" aria-label="Verso ${i+1}, ${a.count} sílabas${t?(a.count===t?', a escuadra':a.count>t?', sobran '+(a.count-t):', faltan '+(t-a.count)):''}"><span class="vnum">${i+1}</span><span class="track"><span class="plank" style="width:${Math.min(a.count,N)/N*100}%"><span class="ptext">${escape(l)}</span><span class="marks">${a.cells.map((c,k)=>`<span class="cell${c.tonic?' tonic':''}${c.ghost?' ghost':''}${t&&k>=t?' over':''}" title="${c.ghost?'sílaba de final agudo':escape(c.text)}">${escape(c.text)}</span>`).join('')}</span></span>${short?`<span class="missing" style="left:${a.count/N*100}%;width:${(t-a.count)/N*100}%">falta ${t-a.count}</span>`:''}</span><span class="stamps"><b class="count ${st}">${a.count}</b><em class="rmark">${sc[i]}</em>${P().notes[i]?'<i class="pencil" title="Tiene una nota">✎</i>':''}</span></button>`}).join('')}</div><div class="bench-status"><span><b>${filled.length}</b> tablas</span>${t?`<span><b>${ok}</b> a escuadra de ${t}</span>`:''}<span>Rima <b>${sc.filter(Boolean).join(' ')}</b></span><span><b>${P().shavings.length}</b> virutas</span></div>`}
function paintPanel(){const box=document.getElementById('panel');if(!box)return;const T=TOOLS[S.tool],ls=lines(),i=S.sel,l=ls[i]||'',a=analyze(l),t=S.target;let h=`<h2>${T.t}</h2><p class="how">${T.how}</p>`;if(!a){box.innerHTML=h+'<p>Elegí una tabla del banco.</p>';return}
 const head=`<p class="eyebrow">Tabla ${i+1} · «${escape(l.length>34?l.slice(0,33)+'…':l)}»</p>`;
 if(S.tool==='metro'){const diff=t?a.count-t:0;h+=head+`<div class="big"><strong>${a.count}</strong><span>sílabas métricas</span></div>${t?`<p class="verdict ${diff?'off':'ok'}">${diff===0?'Mide justo: queda a escuadra.':diff>0?'Le sobra'+(diff>1?'n ':' ')+diff+'. Probá el cepillo o el serrucho.':'Le falta'+(diff<-1?'n ':' ')+(-diff)+'. Probá la cola o la lija.'}</p>`:''}<h3>Marcas del metro</h3><div class="chain">${a.cells.map(c=>`<span class="${c.tonic?'tonic':''}${c.ghost?' ghost':''}">${c.ghost?'+1':escape(c.text)}</span>`).join('')}</div><ul class="facts"><li><span>Sílabas gramaticales</span><b>${a.raw}</b></li><li><span>Sinalefas (‿)</span><b>−${a.joints}</b></li><li><span>Final ${a.type}</span><b>${a.type==='aguda'?'+1':a.type==='esdrújula'?'−1':'±0'}</b></li><li><span>Largo de la tabla</span><b>${a.count}</b></li></ul>`}
 if(S.tool==='nivel'){const lv=levelInfo(a,t),off=Math.max(-90,Math.min(90,(lv.missing?1:0)*(a.count>(t||0)?1:-1)*Math.min(90,28+lv.missing*26)));const N=Math.max(a.count,t||0);h+=head+`<div class="level" role="img" aria-label="${lv.missing?'Fuera de nivel':'A nivel'}"><span class="bubble" style="--off:${t?off:0}px"></span></div><p class="verdict ${t?(lv.missing?'off':'ok'):''}">${lv.name}</p><h3>Acentos de la tabla</h3><div class="accents">${Array.from({length:N},(_,k)=>`<i class="${a.accents.includes(k+1)?'hit':''} ${lv.need.includes(k+1)?'need':''}">${k+1}</i>`).join('')}</div><p class="how" style="margin-top:8px">Negro: acento del verso. Contorno: acento que pide la escuadra.</p>`}
 if(S.tool==='cepillo'){h+=head+`<div class="words">${tokens(l).map((w,k)=>`<button class="word" data-act="plane" data-k="${k}" aria-label="Cepillar «${escape(w)}»">${escape(w)}</button>`).join('')}</div><p class="how" style="margin-top:14px">Mide ${a.count}${t?' · escuadra '+t:''}.</p>`}
 if(S.tool==='serrucho'){const tk=tokens(l);h+=head+`<div class="words saw-words">${tk.map((w,k)=>`<span class="word">${escape(w)}</span>${k<tk.length-1?`<button class="cut" data-act="saw" data-k="${k}" aria-label="Cortar después de «${escape(w)}»" title="Cortar acá">✂</button>`:''}`).join('')}</div><p class="how" style="margin-top:14px">El corte crea dos tablas. Mide ${a.count} sílabas ahora.</p>`}
 if(S.tool==='cola'){const nx=ls.findIndex((x,k)=>k>i&&x.trim()),pv=ls.map((x,k)=>k<i&&x.trim()?k:-1).filter(k=>k>=0).pop();const prev=k=>analyze(ls[k]+' '+lowerFirst(l));h+=head+`${nx>=0?`<button class="btn primary" data-act="glue" data-k="${nx}">Encolar con la tabla ${nx+1} ↓</button><p class="how">Quedaría de ${analyze(l+' '+lowerFirst(ls[nx])).count} sílabas.</p>`:''}${pv!==undefined?`<button class="btn" data-act="glue-up" data-k="${pv}">Encolar con la tabla ${pv+1} ↑</button><p class="how">Quedaría de ${prev(pv).count} sílabas.</p>`:''}${nx<0&&pv===undefined?'<p>No hay otra tabla para encolar.</p>':''}`}
 if(S.tool==='lija'){const lw=a.last.toLowerCase(),cons=[],as=[];RHYMES.forEach(w=>{if(w===lw)return;const r=analyze(w);if(r.key===a.key)cons.push(w);else if(r.ason===a.ason)as.push(w)});h+=head+`<p>Termina en <b style="font:600 22px var(--serif);color:var(--accent)">${escape(a.last)}</b> · rima «-${escape(a.key)}»</p><h3>Consonantes</h3><div class="rhymes">${cons.slice(0,16).map(w=>`<button data-act="sand" data-w="${w}">${w}</button>`).join('')||'<span class="how">Sin consonantes en el rimario de ejemplo.</span>'}</div><h3>Asonantes (${a.ason.split('').join('-')})</h3><div class="rhymes soft">${as.slice(0,14).map(w=>`<button data-act="sand" data-w="${w}">${w}</button>`).join('')||'<span class="how">Sin asonantes en el rimario de ejemplo.</span>'}</div>`}
 if(S.tool==='lapiz'){const notes=Object.entries(P().notes).filter(([,v])=>v);h+=head+`<label class="sr" for="note">Nota para la tabla ${i+1}</label><textarea id="note" class="field" placeholder="Escribí una nota a lápiz…">${escape(P().notes[i]||'')}</textarea><h3>Notas en el banco</h3><ul class="notes">${notes.map(([k,v])=>`<li><b>${Number(k)+1}</b>${escape(v)}</li>`).join('')||'<li>Todavía no hay notas.</li>'}</ul>`}
 if(S.tool==='prensa'){h+=`<label class="sr" for="vname">Nombre de la versión</label><input id="vname" class="field" placeholder="Nombre de la versión (opcional)" value="${escape(S.vname)}"><button class="btn primary" data-act="clamp">Apretar la prensa</button><h3>Versiones fijadas</h3><ul class="versions">${P().versions.map((v,k)=>`<li><b>${escape(v.name)}</b><button class="chip" data-act="restore" data-k="${k}">Volver a esta</button><small>${v.when}</small><em>${escape(v.text.split('\n')[0])}</em></li>`).join('')||'<li>Ninguna todavía.</li>'}</ul>`}
 box.innerHTML=h}
function paintDrawer(){const box=document.getElementById('drawer');if(!box)return;const sh=P().shavings;box.innerHTML=`<h3>Cajón de virutas</h3><p>${sh.length?'Tocá una viruta para devolverla a su tabla.':'Lo que cepilles queda acá. Nada se tira.'}</p><div class="shavings">${sh.map((s,k)=>`<button class="shaving" data-act="unshave" data-k="${k}" style="--r:${((k*47)%22)-11}deg" aria-label="Devolver «${escape(s.word)}» a la tabla ${s.line+1}">${escape(s.word)}</button>`).join('')}</div>`}
const lowerFirst=s=>s.trim().replace(/^./,c=>c.toLowerCase());
function syncRaw(){const r=document.getElementById('raw');if(r&&document.activeElement!==r)r.value=P().text;const u=document.querySelector('[data-act="undo"]');if(u)u.hidden=S.undo===null}
function paintShop(){paintPlanks();paintPanel();paintDrawer();syncRaw()}
function render(){document.body.classList.toggle('noche',S.theme==='noche');document.body.classList.toggle('dia',S.theme!=='noche');const th=document.getElementById('theme');th.textContent=S.theme==='noche'?'☀ Taller de día':'☾ Taller de noche';th.setAttribute('aria-pressed',S.theme==='noche');document.querySelectorAll('.top nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go===S.view)||b.removeAttribute('aria-current'));document.querySelectorAll('.top nav button').forEach(b=>{if(b.dataset.go===S.view)b.setAttribute('aria-current','page')});const v=document.getElementById('view');v.innerHTML=S.view==='taller'?shop():S.view==='biblioteca'?library():home();if(S.view==='taller')paintShop()}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.go){go(d.go);return}
 if(d.open!==undefined){S.cur=Number(d.open);S.target=P().target??8;S.sel=0;S.undo=null;fixSel();go('taller');return}
 if(d.room){toast(d.room==='buzon'?'El buzón de concursos se diseña en la próxima etapa.':'La sala de lectura se diseña en la próxima etapa.');return}
 if(d.tool){S.tool=d.tool;document.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tool===S.tool));paintPanel();return}
 if(d.line!==undefined){S.sel=Number(d.line);paintPlanks();paintPanel();return}
 if(d.target!==undefined){S.target=Number(d.target);P().target=S.target;document.querySelectorAll('[data-target]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.target)===S.target));paintPlanks();paintPanel();return}
 const a=d.act;if(!a)return;const ls=lines(),i=S.sel;
 if(a==='undo'&&S.undo!==null){const u=S.undo;S.undo=null;P().text=u;fixSel();paintShop();toast('Volviste al paso anterior.');return}
 if(a==='plane'){const tk=tokens(ls[i]),k=Number(d.k),w=tk[k];if(tk.length<2){toast('No se puede cepillar la última palabra de una tabla.');return}tk.splice(k,1);ls[i]=tk.join(' ');P().shavings.unshift({line:i,k,word:w});setText(ls.join('\n'));paintShop();toast('«'+w+'» cayó al cajón de virutas.');return}
 if(a==='unshave'){const s=P().shavings.splice(Number(d.k),1)[0],li=Math.min(s.line,ls.length-1),tk=tokens(ls[li]||'');tk.splice(Math.min(s.k,tk.length),0,s.word);ls[li]=tk.join(' ');S.sel=li;setText(ls.join('\n'));paintShop();toast('«'+s.word+'» volvió a la tabla '+(li+1)+'.');return}
 if(a==='saw'){const tk=tokens(ls[i]),k=Number(d.k);ls.splice(i,1,tk.slice(0,k+1).join(' '),tk.slice(k+1).join(' '));setText(ls.join('\n'));paintShop();toast('Tabla cortada en dos.');return}
 if(a==='glue'||a==='glue-up'){const k=Number(d.k),top=Math.min(i,k),bot=Math.max(i,k);ls[top]=ls[top].replace(/\s+$/,'')+' '+lowerFirst(ls[bot]);ls.splice(bot,1);S.sel=top;setText(ls.join('\n'));paintShop();toast('Tablas encoladas.');return}
 if(a==='sand'){ls[i]=ls[i].replace(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*)$/,(m,w,p)=>(w[0]!==w[0].toLowerCase()?d.w[0].toUpperCase()+d.w.slice(1):d.w)+p);setText(ls.join('\n'));paintShop();toast('Probando «'+d.w+'». Podés deshacer.');return}
 if(a==='clamp'){const n=S.vname.trim()||'Versión '+(P().versions.length+1);P().versions.unshift({name:n,when:new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}),text:P().text});S.vname='';paintPanel();toast('Versión «'+n+'» fijada en la prensa.');return}
 if(a==='restore'){const v=P().versions[Number(d.k)];setText(v.text);paintShop();toast('Volviste a «'+v.name+'». Podés deshacer.');return}
 if(a==='new-poem'){S.poems.push({title:'Sin título',author:'Borrador propio',color:'#6b5a8a',edited:'ahora',text:'',target:8,versions:[],notes:{},shavings:[]});S.cur=S.poems.length-1;S.sel=0;S.undo=null;S.target=8;go('taller');setTimeout(()=>document.getElementById('raw')?.focus(),50);return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='raw'){P().text=el.value;S.undo=null;fixSel();paintPlanks();paintPanel();syncRaw()}else if(el.id==='title'){P().title=el.value||'Sin título'}else if(el.id==='note'){P().notes[S.sel]=el.value;paintPlanks()}else if(el.id==='vname'){S.vname=el.value}});
document.getElementById('theme').addEventListener('click',()=>{S.theme=S.theme==='noche'?'dia':'noche';try{localStorage.setItem('mesa.hogar.theme',S.theme)}catch{}render();try{history.replaceState(null,'','#'+S.view+(S.theme==='noche'?'/noche':''))}catch{}});
function fromHash(){const [v,th]=location.hash.slice(1).split('/');if(['hogar','taller','biblioteca'].includes(v))S.view=v;if(th==='noche')S.theme='noche';else if(th==='dia')S.theme='dia';else{try{const s=localStorage.getItem('mesa.hogar.theme');if(s)S.theme=s}catch{}}render()}
fixSel();fromHash();
</script>
</body>
</html>
