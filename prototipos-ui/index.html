'51':d=>{const ls=poem.split('\n'),an=ls.map(scanLine),sc=schemeFor(an),t=A.target,filled=an.filter(Boolean).length,ok=an.filter(x=>x&&(!t||x.count===t)).length;return {title:'Canción del pirata',actions:[0,7,8,11,14].map(m=>chipBtn('target',m,m?m+' sílabas':'Verso libre',A.target===m)).join(''),body:`<div class="app-grid"><div class="margin-editor"><div class="gutter" aria-label="Sílabas métricas por verso">${an.map(x=>`<span class="${x?(t&&x.count!==t?'off':'ok'):''}">${x?x.count:''}</span>`).join('')}</div><textarea data-app-input="poem51" wrap="off" spellcheck="false" rows="${ls.length+1}" aria-label="Poema">${escape(poem)}</textarea><div class="gutter rhyme-col" aria-label="Esquema de rima">${sc.map(l=>`<span>${l}</span>`).join('')}</div></div><aside class="app-card"><h3>Resumen</h3><div class="stat-big"><strong>${ok}/${filled}</strong><span>${t?'versos de '+t+' sílabas':'versos medidos'}</span></div><p class="mono">${sc.filter(Boolean).join(' ')||'—'}</p><ul class="legend">${an.map((x,i)=>x?`<li><b>${i+1}</b>${x.type} · rima «-${escape(x.key)}»</li>`:'').join('')}</ul></aside></div>`,note:'Conteo aproximado del prototipo. En la app, lo haría el analizador del Escandidor.'}},
'52':d=>{const ls=poem.split('\n'),an=ls.map(scanLine),sc=schemeFor(an);let s=Math.min(A.sel,ls.length-1);if(!an[s])s=Math.max(0,an.findIndex(Boolean));A.sel=s;const cur=an[s],cons=[],ason=[];if(cur){const lw=cleanWord(cur.last);for(const w of RHYME_POOL){if(w===lw)continue;const r=scanLine(w);if(r.key===cur.key)cons.push(w);else if(r.ason===cur.ason)ason.push(w)}}const chips=list=>list.slice(0,14).map(w=>`<button class="chip" data-app="try" data-v="${w}">${w}</button>`).join('')||'<span class="tiny">Sin resultados en el rimario de ejemplo.</span>';return {title:'Rimario',actions:A.prev!==null?'<button data-app="undo">↶ Deshacer</button>':'',body:`<div class="app-grid"><div class="verse-list">${ls.map((l,i)=>an[i]?`<button class="verse-row ${i===s?'on':''}" data-app="sel" data-v="${i}" aria-pressed="${i===s}"><b>${an[i].count}</b><span>${escape(l)}</span><em>${sc[i]}</em></button>`:'').join('')}</div><aside class="app-card rhyme-panel">${cur?`<p class="eyebrow">Verso ${s+1} termina en</p><p class="big-word">${escape(cur.last)}</p><p class="tiny">${cur.type} · consonante «-${escape(cur.key)}» · asonante «${cur.ason.split('').join('-')}»</p><h3>Consonantes</h3><div class="chips">${chips(cons)}</div><h3>Asonantes</h3><div class="chips">${chips(ason)}</div>`:'<p class="tiny">Escribí un verso para buscar rimas.</p>'}</aside></div>`,note:'Rimario de ejemplo de unas 180 palabras. Tocá una palabra para probarla al final del verso.'}},
'53':d=>{const f=FORMS[A.form],n=f.s.length;if(!A.slots[A.form])A.slots[A.form]=A.form==='redondilla'?original.split('\n'):Array(n).fill('');const sl=A.slots[A.form],an=sl.map(x=>x.trim()?scanLine(x):null);let good=0;const rows=sl.map((txt,i)=>{const exp=f.m[i%f.m.length],L=f.s[i],x=an[i],mOk=!!x&&x.count===exp;let r='',rOk=null;if(L!=='-'&&x){const j=sl.findIndex((_,k)=>k!==i&&f.s[k]===L&&an[k]);if(j>=0){rOk=L===L.toUpperCase()?x.key===an[j].key:x.ason===an[j].ason;r=rOk?`rima con v. ${j+1}`:`no rima con v. ${j+1}`}else r='espera su pareja'}if(mOk&&rOk!==false)good++;return `<div class="slot ${A.form==='soneto'&&[4,8,11].includes(i)?'gap':''}"><span class="slot-n">${i+1}</span><input data-app-input="slot" data-i="${i}" value="${escape(txt)}" placeholder="Verso de ${exp} sílabas" aria-label="Verso ${i+1} de ${f.n}"><span class="slot-l">${L==='-'?'·':L}</span><span class="slot-s"><b class="${x?(mOk?'ok':'bad'):''}">${x?x.count:'–'} / ${exp}</b><small class="${rOk===false?'bad':rOk?'ok':''}">${L==='-'?'sin rima':r||'·'}</small></span></div>`}).join('');return {title:f.n,actions:Object.entries(FORMS).map(([k,v])=>chipBtn('form',k,v.n,A.form===k)).join(''),body:`<div class="app-grid"><div class="app-card form-card">${rows}</div><aside class="app-card"><h3>${f.n}</h3><div class="stat-big"><strong>${good}/${n}</strong><span>versos cumplen</span></div><div class="meter-bar"><i style="width:${good/n*100}%"></i></div><p class="mono">${f.s.split('').join(' ')}</p><p class="tiny">${f.d} Mayúscula: rima consonante. Minúscula: asonante.</p><button data-app="clear-form">Vaciar molde</button></aside></div>`,note:'Medida y rima aproximadas del prototipo.'}},
'54':d=>{const tags=['todas',...new Set(A.frags.map(f=>f.tag))],list=A.frags.map((f,i)=>({...f,i})).filter(f=>A.tag==='todas'||f.tag===A.tag),n=A.frags.filter(f=>f.on).length;return {title:'Cuaderno',actions:'<span class="chip">Sincronizado en este dispositivo</span>',body:`<div class="pocket-split"><div class="phone"><div class="phone-bar"><b>Cuaderno</b><span>${A.frags.length} fragmentos</span></div><div class="capture"><input data-app-input="newFrag" value="${escape(A.newFrag)}" placeholder="Anotá un verso o una imagen…" aria-label="Nuevo fragmento"><div class="capture-row"><select data-app-input="newTag" aria-label="Etiqueta">${['imagen','mar','pregunta','sonido'].map(t=>`<option ${A.newTag===t?'selected':''}>${t}</option>`).join('')}</select><button class="primary" data-app="add-frag">Guardar</button></div></div><div class="chips">${tags.map(t=>chipBtn('tag',escape(t),escape(t),A.tag===t)).join('')}</div><div class="frags">${list.map(f=>`<button class="frag ${f.on?'on':''}" data-app="frag" data-v="${f.i}" aria-pressed="${f.on}"><span>${escape(f.t)}</span><small>#${escape(f.tag)}</small></button>`).join('')}</div></div><aside class="app-card"><h3>Borrador armado</h3><p class="tiny">Tocá fragmentos para elegirlos y después unilos en un poema.</p><button class="primary" data-app="join" ${n?'':'disabled'}>Unir ${n} fragmento${n===1?'':'s'}</button>${A.draft?`<div class="draft">${A.draft.split('\n').map(l=>{const x=scanLine(l);return `<p><b>${x?x.count:''}</b><span>${escape(l)}</span></p>`}).join('')}</div><button data-app="draft-to-editor">Seguir en Medida al margen →</button>`:''}</aside></div>`}},
'55':d=>{const vt=i=>VERSIONS[i].t??poem,a=vt(A.vA).split('\n'),b=vt(A.vB).split('\n'),n=Math.max(a.length,b.length);let changes=0,rows='';for(let i=0;i<n;i++){const [da,db]=diffWords(a[i]||'',b[i]||'');changes+=(da.match(/<del>/g)||[]).length+(db.match(/<ins>/g)||[]).length;const ca=scanLine(a[i]||''),cb=scanLine(b[i]||'');rows+=`<div class="diff-row"><p>${da}</p><span class="delta">${ca?ca.count:'–'} → ${cb?cb.count:'–'}</span><p>${db}</p></div>`}const opt=s=>VERSIONS.map((v,i)=>`<option value="${i}" ${i===s?'selected':''}>${v.n} · ${v.when}</option>`).join('');return {title:'Versiones',actions:`<span class="chip">${changes} palabras cambiadas</span>`,body:`<div class="app-grid"><div class="app-card"><div class="diff-head"><label>Antes<select data-app-input="vA">${opt(A.vA)}</select></label><label>Después<select data-app-input="vB">${opt(A.vB)}</select></label></div>${rows}</div><aside class="app-card"><h3>Historia del poema</h3><ol class="history">${VERSIONS.map((v,i)=>`<li class="${i===A.vA||i===A.vB?'on':''}"><b>${v.n}</b><small>${v.when}${v.t===null?' · editable':''}</small>${v.t!==null?`<button data-app="vpair" data-v="${i}">Comparar con la actual</button>`:''}</li>`).join('')}</ol><button data-app="restore" ${VERSIONS[A.vA].t===null?'disabled':''}>Recuperar «antes» como borrador</button></aside></div>`,note:'Comparación palabra por palabra. Las cifras centrales son la medida aproximada antes y después.'}},
'56':d=>{const ls=poem.split('\n').filter(l=>l.trim()),st=Math.min(A.stage,Math.max(0,ls.length-1)),commas=(poem.match(/[,;:]/g)||[]).length;return {title:'Ensayo de lectura',actions:'<span class="chip">Sin grabación</span>',body:`<div class="stage"><div class="stage-progress"><i style="width:${ls.length?(st+1)/ls.length*100:0}%"></i></div><div class="stage-lines">${ls.map((l,i)=>`<p class="stage-line ${i===st?'now':i<st?'done':''}">${escape(l).replace(/([,;:])/g,'$1<span class="breath" title="pausa breve">◦</span>')}<span class="breath long" title="respiración">‖</span></p>`).join('')}</div><div class="stage-controls"><button data-app="stage-prev" aria-label="Verso anterior">←</button><button class="primary" data-app="stage-next">Siguiente verso →</button><button data-app="stage-reset">Desde el principio</button><label class="pace">Ritmo <input type="range" min="70" max="170" step="10" value="${A.wpm}" data-app-input="wpm" aria-label="Palabras por minuto"><b>${A.wpm} palabras/min</b></label></div><div class="stage-stats"><span><b data-live="secs">≈ ${stageSecs()} s</b> de lectura</span><span><b>${st+1}/${ls.length}</b> versos</span><span><b>${commas}</b> pausas breves</span></div></div>`,note:'◦ pausa breve · ‖ respiración al final del verso. El ensayo no graba ni reproduce audio.'}},
'57':d=>{const {toc,total}=bookLayout(),sel=A.book[A.bookSel]||A.book[0];let rows='',sec=null;A.book.forEach((p,i)=>{if(p.s!==sec){sec=p.s;rows+=`<p class="toc-sec">${escape(sec)}</p>`}rows+=`<div class="book-row ${i===A.bookSel?'on':''}"><button class="text-button" data-app="book-sel" data-v="${i}" aria-pressed="${i===A.bookSel}"><b>${escape(p.t)}</b><small>${p.n} versos · pág. ${p.page}</small></button><button data-app="up" data-v="${i}" aria-label="Subir ${escape(p.t)}" ${i===0?'disabled':''}>↑</button><button data-app="down" data-v="${i}" aria-label="Bajar ${escape(p.t)}" ${i===A.book.length-1?'disabled':''}>↓</button></div>`});const verses=sel.t==='Canción del pirata'?poem.split('\n').map(l=>`<p class="page-verse">${escape(l)}</p>`).join(''):Array.from({length:Math.min(sel.n,12)},(_,k)=>`<div class="page-bar" style="width:${55+((k*29)%40)}%"></div>`).join('');return {title:escape(A.bookTitle)||'Poemario',actions:'<button data-app="noop-pdf">Vista PDF</button>',body:`<div class="book-grid"><div class="app-card"><div class="book-head"><input data-app-input="bookTitle" value="${escape(A.bookTitle)}" aria-label="Título del poemario"></div>${rows}</div><div><div class="spread"><div class="page"><p class="eyebrow center">Índice</p>${toc.map(t=>t.sec?`<p class="toc-sec">${escape(t.sec)}</p>`:`<div class="toc-line"><span>${escape(t.p.t)}</span><i></i><b>${t.page}</b></div>`).join('')}<span class="folio">7</span></div><div class="page"><p class="eyebrow center">${escape(sel.s)}</p><h4>${escape(sel.t)}</h4>${verses}<span class="folio">${sel.page}</span></div></div><div class="book-stats"><span><b>${A.book.length}</b> poemas</span><span><b>${new Set(A.book.map(p=>p.s)).size}</b> secciones</span><span><b>${total}</b> páginas en pliegos de 16</span></div></div></div>`,note:'Paginación estimada: 24 versos por página y una portadilla por sección. Al cruzar de sección, ↑ y ↓ cambian el poema de sección.'}},
'58':d=>{const ck=contestChecks(),okN=ck.filter(c=>c[2]).length,c=A.contests[A.contest],card=(x,i)=>{const n=daysLeft(x);return `<button class="contest ${i===A.contest?'on':''}" data-app="contest" data-v="${i}" aria-pressed="${i===A.contest}"><div><b>${x.n}</b><small>${x.city} · ${x.prize}</small></div><span class="days ${x.status==='prep'&&n>=0&&n<=10?'urgent':''}">${x.status==='sent'?'enviado':n<0?'cerrado':n===0?'hoy':n+' días'}</span></button>`};return {title:'Concursos',actions:`<span class="chip">${A.contests.filter(x=>x.status==='prep').length} en preparación</span>`,body:`<div class="app-grid"><div class="board"><div><h3>Preparando</h3>${A.contests.map((x,i)=>x.status==='prep'?card(x,i):'').join('')||'<p class="tiny">Nada pendiente.</p>'}</div><div><h3>Enviados</h3>${A.contests.map((x,i)=>x.status==='sent'?card(x,i):'').join('')||'<p class="tiny">Todavía nada.</p>'}</div></div><aside class="app-card"><p class="eyebrow">Bases vs. tu poema</p><h3>${c.n}</h3><p class="tiny">Cierra el ${new Date(c.dl+'T00:00:00').toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}</p><div class="stat-big"><strong>${okN}/${ck.length}</strong><span>requisitos</span></div><ul class="checklist">${ck.map(([l,t,ok])=>`<li><span class="mark ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><div>${l}<small>${t}</small></div></li>`).join('')}</ul><label class="tiny" for="pseud-input">Seudónimo</label><input id="pseud-input" class="pseud" data-app-input="pseud" value="${escape(A.pseud)}" placeholder="Ej.: Capitán del Alba"><div class="toggles">${chipBtn('plica','',A.plica?'✓ Plica lista':'Preparar plica',A.plica)}${chipBtn('inedito','',A.inedito?'✓ Inédito':'Declarar inédito',A.inedito)}</div><button class="primary" data-app="send" ${c.status==='sent'?'disabled':''}>${c.status==='sent'?'Ya enviado':'Marcar como enviado'}</button></aside></div>`,note:'Concursos de ejemplo. La revisión usa el poema abierto y el conteo aproximado del prototipo.'}},
'59':d=>{const ls=poem.split('\n'),vis=A.comments.map((c,i)=>({...c,i})).filter(c=>A.cfilter==='todas'||c.kind===A.cfilter),cl=Math.min(A.cline,ls.length-1),thread=vis.filter(c=>c.line===cl);return {title:'Taller · Canción del pirata',actions:['todas','pregunta','sugerencia','elogio'].map(k=>chipBtn('cfilter',k,k,A.cfilter===k)).join(''),body:`<div class="app-grid"><div class="app-card"><div class="readers">${['L','M','I'].map(x=>`<span class="avatar">${x}</span>`).join('')}<span class="tiny">3 lectores invitados</span></div><div class="ws-lines">${ls.map((l,i)=>{const n=vis.filter(c=>c.line===i&&!c.done).length;return l.trim()?`<button class="ws-line ${i===cl?'on':''}" data-app="cline" data-v="${i}" aria-pressed="${i===cl}"><span>${escape(l)}</span><span class="badge ${n?'':'zero'}" aria-label="${n} comentarios abiertos">${n}</span></button>`:''}).join('')}</div></div><aside class="app-card"><p class="eyebrow">Verso ${cl+1}</p>${thread.map(c=>`<div class="comment ${c.done?'done':''}"><span class="avatar">${escape(c.who[0])}</span><div><small><b>${escape(c.who)}</b><span class="kind">${c.kind}</span></small><p>${escape(c.t)}</p><button class="text-button" data-app="resolve" data-v="${c.i}">${c.done?'Reabrir':'Resolver'}</button></div></div>`).join('')||'<p class="tiny">Sin comentarios en este verso.</p>'}<div class="ws-compose"><textarea data-app-input="newComment" placeholder="Dejá una nota para este verso…" aria-label="Nuevo comentario">${escape(A.newComment)}</textarea><button class="primary" data-app="post">Comentar</button></div></aside></div>`,note:'Lectores y comentarios de ejemplo.'}},

'57':()=>`<div class="page pv-toc"><p class="eyebrow center">Índice</p>${[['I · Mar abierto'],['Canción del pirata','9'],['Bergantín','10'],['Diez cañones','11'],['II · Noche'],['Luna de proa','14'],['Vela encendida','15']].map(([t,p])=>p?`<div class="toc-line"><span>${t}</span><i></i><b>${p}</b></div>`:`<p class="toc-sec">${t}</p>`).join('')}</div>`,
'58':()=>freshApp().contests.slice(0,3).map(c=>{const n=daysLeft(c);return `<div class="pv-contest"><div><b>${c.n}</b><small>${c.city} · ${c.prize}</small></div><span class="days ${n>=0&&n<=10?'urgent':''}">${n<0?'cerrado':n+' días'}</span></div>`}).join('')+'<p class="tiny">Bases revisadas contra tu poema antes de enviar.</p>',
'59':()=>`<div class="pv-line"><span>no corta el mar, sino vuela</span><span class="badge">2</span></div><div class="comment"><span class="avatar">M</span><div><small><b>Marcos</b><span class="kind">elogio</span></small><p>Acá está la imagen del poema.</p></div></div><div class="comment"><span class="avatar">I</span><div><small><b>Inés</b><span class="kind">sugerencia</span></small><p>¿Y sin la coma después de «mar»?</p></div></div>`,
'60':()=>`<div class="prompt-card"><p class="eyebrow">Consigna del día</p><h3>Cuarteta del mar</h3><p>Cuatro octosílabos. Los versos 2 y 4 riman en «-ela».</p></div><div class="heat">${HEAT.map(v=>`<i class="l${v}"></i>`).join('')}<i class="today"></i></div><p class="tiny">6 días seguidos · hoy falta escribir</p>`};
function appContent(d){if(screen==='home')return `<div class="app-home"><div class="intro"><p class="eyebrow">App para poetas · Herramienta ${d.id}</p><h1>${d.headline}</h1><p class="lead">${d.copy}</p><ul class="app-feats">${d.feats.map(f=>`<li>${f}</li>`).join('')}</ul><div class="hero-actions"><button class="primary" data-action="editor">${d.cta} ↗</button></div></div><div class="app-preview" aria-hidden="true">${PREVIEW[d.id](d)}</div></div><div class="creative-footer"><span>Escritura propia / sin IA</span><span>Una de las 10 herramientas de la app</span><span>${NAV.find(x=>x[0]===d.id)[1]} · ${d.name}</span></div>`;
 if(subview==='library')return `<div class="main-area">${library(d)}</div>`;
 const v=APP[d.id](d);return `<div class="app-screen comp-${d.composition}"><nav class="app-nav" aria-label="Herramientas de la app">${NAV.map(([id,n,ic])=>`<button data-app="nav" data-v="${id}" class="${id===d.id?'on':''}" ${id===d.id?'aria-current="page"':''}><i aria-hidden="true">${ic}</i>${n}</button>`).join('')}</nav><div class="app-main"><div class="app-top"><div><p class="eyebrow">${d.id} · ${d.name}</p><h2>${v.title}</h2></div><div class="app-actions">${v.actions||''}</div></div>${v.body}<p class="app-note">${v.note||'Prototipo de interacción · datos de ejemplo · cambios solo en esta sesión.'}</p><div class="toast" id="toast" role="status"></div></div></div>`}
function appClick(b){const a=b.dataset.app,v=b.dataset.v;let msg='';switch(a){
 case 'nav':current=designs.findIndex(x=>x.id===v);screen='editor';subview='editor';focused=false;break;
 case 'target':A.target=Number(v);break;case 'sel':A.sel=Number(v);break;
 case 'try':{const ls=poem.split('\n'),i=A.sel;if(!ls[i])break;A.prev=poem;ls[i]=ls[i].replace(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*)$/,(m,w,p)=>(w[0]!==w[0].toLowerCase()?v[0].toUpperCase()+v.slice(1):v)+p);poem=ls.join('\n');msg='Probando «'+v+'». Podés deshacer.';break}
 case 'undo':if(A.prev!==null){poem=A.prev;A.prev=null;msg='Cambio deshecho.'}break;
 case 'form':A.form=v;break;case 'clear-form':A.slots[A.form]=Array(FORMS[A.form].s.length).fill('');break;
 case 'tag':A.tag=v;break;case 'frag':A.frags[Number(v)].on=!A.frags[Number(v)].on;break;
 case 'add-frag':if(A.newFrag.trim()){A.frags.unshift({t:A.newFrag.trim(),tag:A.newTag,on:true});A.newFrag='';msg='Fragmento guardado.'}else msg='Escribí algo antes de guardar.';break;
 case 'join':A.draft=A.frags.filter(f=>f.on).map(f=>f.t).join('\n');msg='Borrador armado con los fragmentos elegidos.';break;
 case 'draft-to-editor':poem=A.draft;current=designs.findIndex(x=>x.id==='51');screen='editor';subview='editor';break;
 case 'vpair':A.vA=Number(v);A.vB=VERSIONS.length-1;break;
 case 'restore':if(VERSIONS[A.vA].t!==null){poem=VERSIONS[A.vA].t;msg='Recuperaste «'+VERSIONS[A.vA].n+'» como borrador actual.'}break;
 case 'stage-next':A.stage=Math.min(A.stage+1,Math.max(0,poem.split('\n').filter(l=>l.trim()).length-1));break;case 'stage-prev':A.stage=Math.max(0,A.stage-1);break;case 'stage-reset':A.stage=0;break;
 case 'book-sel':A.bookSel=Number(v);break;case 'up':moveBook(Number(v),-1);break;case 'down':moveBook(Number(v),1);break;case 'noop-pdf':msg='En la app, esta vista genera el PDF del poemario.';break;
 case 'contest':A.contest=Number(v);break;case 'plica':A.plica=!A.plica;break;case 'inedito':A.inedito=!A.inedito;break;
 case 'send':{const miss=contestChecks().filter(c=>!c[2]).map(c=>c[0].toLowerCase());if(miss.length)msg='Falta: '+miss.join(', ')+'.';else{A.contests[A.contest].status='sent';msg='Concurso marcado como enviado.'}break}
 case 'cline':A.cline=Number(v);break;case 'cfilter':A.cfilter=v;break;
 case 'post':if(A.newComment.trim()){A.comments.push({line:Math.min(A.cline,poem.split('\n').length-1),who:'Vos',kind:'nota',t:A.newComment.trim(),done:false});A.newComment='';msg='Comentario agregado al verso '+(A.cline+1)+'.'}else msg='Escribí un comentario primero.';break;
 case 'resolve':A.comments[Number(v)].done=!A.comments[Number(v)].done;break;
 case 'prompt':A.prompt=(A.prompt+1)%PROMPTS.length;A.daily='';break}
 render();if(msg)say(msg)}
function appInput(el){const k=el.dataset.appInput,v=el.value;if(k==='wpm'){A.wpm=Number(v);const lab=root.querySelector('.pace b'),s=root.querySelector('[data-live="secs"]');if(lab)lab.textContent=A.wpm+' palabras/min';if(s)s.textContent='≈ '+stageSecs()+' s';return}if(k==='poem51')poem=v;else if(k==='slot')A.slots[A.form][Number(el.dataset.i)]=v;else if(k==='vA'||k==='vB')A[k]=Number(v);else A[k]=v;const idx=el.dataset.i,pos=el.selectionStart,end=el.selectionEnd,top=el.scrollTop;render();const n=root.querySelector(`[data-app-input="${k}"]${idx!==undefined?`[data-i="${idx}"]`:''}`);if(n){n.focus();try{n.setSelectionRange(pos,end)}catch{}n.scrollTop=top}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b&&!b.disabled)appClick(b)});
root.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.appInput)appInput(e.target)});
function render(){const d=designs[current];selected=Math.min(selected,Math.max(0,poem.split('\n').length-1));select.value=current;document.getElementById('counter').textContent=(current+1)+' / '+designs.length;document.getElementById('design-title').textContent=d.id+' · '+d.name;document.getElementById('design-description').textContent=d.description;document.getElementById('home').setAttribute('aria-pressed',screen==='home');document.getElementById('editor').setAttribute('aria-pressed',screen==='editor');const fav=favorites.includes(d.id);document.getElementById('favorite').setAttribute('aria-pressed',fav);document.getElementById('favorite').textContent=fav?'★ Favorito':'☆ Favorito';
 root.className='prototype '+d.layout+(d.creative?' creative':'')+(d.app?' app':'')+(focused&&screen==='editor'?' focus':'');const on=d.on||(['5B','8A','8B'].includes(d.id)?'#18252b':'#fff');root.style.cssText=`--paper:${d.paper};--surface:${d.surface};--ink:${d.ink};--quiet:${d.quiet};--line:${d.line};--accent:${d.accent};--wash:${d.wash};--on:${on}`;
 root.innerHTML=`<header><div class="brand">${d.id.startsWith('9')?'VERSO':d.id.startsWith('4')?'Mesa de Poesía':'mesa de poesía'}<span>.</span></div><nav><button class="text-button" data-action="home">Inicio</button><button class="text-button" data-action="library">Biblioteca</button><button class="${screen==='home'?'primary':''}" data-action="${screen==='home'?'editor':'focus'}">${screen==='home'?'Abrir taller':focused?'Salir del foco':'Concentración'}</button></nav></header>`;
 if(d.creative){root.innerHTML+=creativeContent(d);finishRender(d);return}
  if(d.app){root.innerHTML+=appContent(d);finishRender(d);return}
 if(screen==='home'){root.innerHTML+=`<div class="hero"><div><p class="eyebrow">${d.id.startsWith('5')?'Poesía · medida · ritmo':'Un taller de poesía en español'}</p><h1>${d.headline}</h1><p class="lead">${d.copy}</p><div class="hero-actions"><button class="primary" data-action="editor">${d.cta} ↗</button>${!d.id.startsWith('10')?'<button class="text-button" data-action="library">Explorar biblioteca</button>':''}</div></div>${sample(d)}</div><div class="feature-strip"><div><b>01 / Escribí</b><p>Tu voz y una hoja abierta.</p></div><div><b>02 / Revisá</b><p>Medida, acentos y rimas.</p></div><div><b>03 / Conservá</b><p>El camino de tus poemas.</p></div></div>`;
 // Immediate concepts place the entry field before their primary action.
 if(d.id.startsWith('10')){const hero=root.querySelector('.hero'),sampleNode=hero.querySelector('.sample'),actions=hero.querySelector('.hero-actions');actions.before(sampleNode)}
 }else root.innerHTML+=`<div class="workspace"><aside class="sidebar"><p class="eyebrow">Mi taller</p>${[['editor','Escribir'],['library','Biblioteca'],['contests','Entregas']].map(([v,n])=>`<button data-view="${v}" class="${subview===v?'active':''}">${n}</button>`).join('')}<span class="tiny">Tu espacio de poesía</span></aside><div class="main-area"><div class="document-bar"><strong>${subview==='editor'?'CUADERNO / BORRADORES':subview==='library'?'MI OBRA / BIBLIOTECA':'PUBLICAR / ENTREGAS'}</strong><button data-action="download">Descargar TXT ↓</button></div>${subview==='library'?library(d):subview==='contests'?'<p class="eyebrow">Preparación de entregas</p><h2>Una página lista para compartir.</h2><div class="sample"><h3>Cuaderno del mar</h3><p class="lead">Selección de ejemplo · 3 poemas · formato de lectura</p><button data-action="download" class="primary">Descargar poema de muestra</button></div><p class="tiny" style="margin-top:18px">Los concursos, documentos y fechas se presentan aquí como una dirección visual.</p>':editor(d)}<div class="toast" id="toast" role="status"></div></div></div>`;
finishRender(d)}
function finishRender(d){updateOverview();const hash=d.id+'/'+screen;if(location.hash.slice(1)!==hash){try{history.replaceState(null,'','#'+hash)}catch{}}}
function updateOverview(){document.getElementById('overview').innerHTML=designs.map((d,i)=>`<button class="choice" data-design="${i}" aria-pressed="${i===current}"><span class="swatches">${[d.paper,d.ink,d.accent].map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>${d.id} · ${d.name}</b><small>${favorites.includes(d.id)?'★ Guardado como favorito':'Portada + escandidor'}</small></button>`).join('')}
function move(i){current=(i+designs.length)%designs.length;step=0;focused=false;alternate=false;render()}
function setScreen(s){screen=s;subview='editor';render()}
document.getElementById('prev').onclick=()=>move(current-1);document.getElementById('next').onclick=()=>move(current+1);select.onchange=()=>move(Number(select.value));document.getElementById('home').onclick=()=>setScreen('home');document.getElementById('editor').onclick=()=>setScreen('editor');document.getElementById('show-all').onclick=()=>{const o=document.getElementById('overview');o.hidden=!o.hidden;document.getElementById('show-all').setAttribute('aria-expanded',!o.hidden);document.getElementById('show-all').textContent=o.hidden?'Ver los 70':'Cerrar galería'};
document.getElementById('favorite').onclick=()=>{const id=designs[current].id;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];try{localStorage.setItem('escandidor.ui-concepts.favorites',JSON.stringify(favorites))}catch{}render()};
document.getElementById('overview').onclick=e=>{const b=e.target.closest('[data-design]');if(b)move(Number(b.dataset.design))};
document.getElementById('new-designs').onclick=()=>{screen='home';subview='editor';move(60)};
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pick!==undefined){selected=Number(b.dataset.pick);render();return}const a=b.dataset.action;if(a==='experiment'){alternate=!alternate;render()}if(a==='edit-text'){const details=document.getElementById('creative-edit');if(details){details.open=!details.open;b.setAttribute('aria-expanded',details.open);if(details.open)details.querySelector('textarea').focus()}}if(a==='apply-text'){selected=0;render()}});
root.addEventListener('toggle',e=>{if(e.target.id==='creative-edit'){const b=root.querySelector('[data-action="edit-text"]');if(b)b.setAttribute('aria-expanded',e.target.open)}},true);
root.addEventListener('input',e=>{if(e.target.matches('#poem,#quick-poem')){poem=e.target.value;const n=document.getElementById('metric-value'),s=document.getElementById('scan-value'),p=document.getElementById('metric-note');if(n)n.textContent=poem===original?'8':'—';if(s)s.textContent=poem===original?scans[selected]:'Texto modificado';if(p)p.textContent=poem===original?'Métrica del ejemplo.':'Este prototipo no calcula la métrica del texto editado.';const status=document.getElementById('edit-status');if(status)status.textContent='Borrador modificado · solo en esta sesión'}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.verse!==undefined){selected=Number(b.dataset.verse);render();return}if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();return}if(b.dataset.view){subview=b.dataset.view;render();return}const a=b.dataset.action;if(a==='home')setScreen('home');if(a==='editor'||a==='open-book')setScreen('editor');if(a==='library'){screen='editor';subview='library';render()}if(a==='focus'){focused=!focused;render()}if(a==='download'){const blob=new Blob([poem],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='poema-prototipo.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);const t=document.getElementById('toast');if(t)t.textContent='Texto descargado.'}});
function fromHash(){const [id,s]=location.hash.slice(1).split('/');const i=designs.findIndex(d=>d.id===id);if(i>=0)current=i;if(s==='editor'||s==='home')screen=s;render()}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
