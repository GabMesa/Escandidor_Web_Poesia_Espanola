<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de Poesía · Manual de taller (inspirado en The Poetry Home Repair Manual)</title>
<style>
:root{
 --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
 --ui:system-ui,-apple-system,'Segoe UI',sans-serif;
 --mono:ui-monospace,'Cascadia Mono','Consolas',monospace;
 --poem-font:Georgia,'Times New Roman',serif;
 --scale:1;
}
body{
 --desk:#efe8db;
 --desk-2:#e5dccb;
 --paper:#fbf8f1;
 --folio:#f5f0e4;
 --ink:#231d18;
 --muted:#6b6054;
 --line:#dad0be;
 --line-strong:#b8aa92;
 --accent:#ad4227;
 --accent-soft:#f5e5df;
 --on-accent:#fffaf5;
 --slate:#2c5673;
 --slate-soft:#e4edf3;
 --sage:#2f684a;
 --sage-soft:#e1efe6;
 --brass:#b4812d;
 --brass-soft:#f6edd9;
 --danger:#b03527;
 --danger-soft:#fae4e1;
 --shadow-sm:0 1px 2px rgba(42,31,20,.05),0 4px 14px rgba(42,31,20,.04);
 --shadow-md:0 2px 4px rgba(42,31,20,.06),0 14px 32px rgba(42,31,20,.07);
}
body.dark{
 --desk:#161311;
 --desk-2:#201b17;
 --paper:#241f1b;
 --folio:#1d1916;
 --ink:#ece4d6;
 --muted:#aba092;
 --line:#3a322a;
 --line-strong:#574b3f;
 --accent:#e07b5a;
 --accent-soft:#3a231c;
 --on-accent:#1c120d;
 --slate:#7fb0cf;
 --slate-soft:#1d2e3a;
 --sage:#7bc09a;
 --sage-soft:#1c3226;
 --brass:#dfa552;
 --brass-soft:#352919;
 --danger:#ec8374;
 --danger-soft:#3d1f1c;
 --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);
 --shadow-md:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.3);
}
body.tinted{
 --accent:var(--poem-tint);
 --accent-soft:color-mix(in srgb,var(--poem-tint) 14%,var(--paper));
 --desk:color-mix(in srgb,var(--poem-tint) 5%,var(--base-desk,#efe8db));
}
body.dark.tinted{
 --desk:color-mix(in srgb,var(--poem-tint) 6%,#161311);
 --accent-soft:color-mix(in srgb,var(--poem-tint) 22%,var(--paper));
}
*{box-sizing:border-box}
html{background:var(--desk);scroll-behavior:smooth}
body{margin:0;background:var(--desk);color:var(--ink);font:14px/1.55 var(--ui);transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shared craft manual tokens */
.section-tag{display:inline-flex;align-items:center;gap:8px;font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.section-tag:before{content:'§';font:700 13px var(--serif);color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 14px;font:500 13px/1.2 var(--ui);text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--folio);border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--desk-2);color:var(--ink);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.icon{padding:6px 8px;min-width:32px;height:32px}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:600 11px var(--ui);background:var(--desk-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.sage{background:var(--sage-soft);color:var(--sage)}
.pill.slate{background:var(--slate-soft);color:var(--slate)}

/* Hairline calibrated pica/meter rule (subtle bookbinder / craft motif) */
.ruler-hairline{height:7px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,var(--brass) 0 1px,transparent 1px 48px);background-size:100% 4px,100% 7px;background-position:bottom left,bottom left;background-repeat:repeat-x;border-bottom:1px solid var(--line);opacity:.7}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:14px;padding:11px clamp(14px,3vw,32px);max-width:1600px;margin:auto}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;text-decoration:none}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.brand-mark svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand-text b{display:block;font:600 18px/1.05 var(--serif);letter-spacing:-.02em}
.brand-text small{display:block;font:italic 11.5px/1.2 var(--serif);color:var(--muted)}
.top-nav{display:flex;align-items:center;gap:4px;margin-left:12px}
.top-nav button{background:none;border:0;border-radius:6px;padding:7px 12px;font:500 13px var(--ui);color:var(--muted)}
.top-nav button:hover{color:var(--ink);background:var(--desk)}
.top-nav button[aria-current=page]{color:var(--ink);background:var(--desk);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--folio);border:1px solid var(--line)}
.sync-pill i{width:7px;height:7px;border-radius:50%;background:var(--sage);display:block}
.back-gallery{font-size:12px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;border:1px dashed var(--line-strong)}
.back-gallery:hover{color:var(--ink);border-style:solid}

/* ==================== LANDING (INICIO) ==================== */
.landing{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,44px) 64px}
.edition-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:3px double var(--line-strong);font:600 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.l-hero{display:grid;grid-template-columns:1.08fr .96fr;gap:clamp(28px,5vw,60px);align-items:center;padding:clamp(34px,5.5vw,66px) 0 46px;border-bottom:1px solid var(--line)}
.l-hero h1{font:normal clamp(38px,5.2vw,66px)/1.04 var(--serif);letter-spacing:-.035em;margin:0 0 20px}
.l-hero h1 em{color:var(--accent);font-style:italic}
.l-copy{font-size:16px;line-height:1.72;color:var(--muted);margin:0 0 14px;max-width:500px}
.l-copy strong{color:var(--ink);font-weight:600}
.l-actions{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 14px}
.l-note{font-size:12px;color:var(--muted);margin:0}

/* Open Craft-Manual Specimen Card on Landing */
.manual-specimen{position:relative;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-md);overflow:hidden}
.manual-specimen-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 18px;background:var(--folio);border-bottom:1px solid var(--line);font:600 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.manual-specimen-head em{font:italic 12px var(--serif);letter-spacing:0;text-transform:none;color:var(--accent)}
.specimen-body{padding:24px 24px 20px;background:linear-gradient(90deg,transparent 0 44px,color-mix(in srgb,var(--accent) 20%,transparent) 44px 45px,transparent 45px),var(--paper)}
.specimen-verse-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line)}
.specimen-verse-row:last-of-type{border-bottom:0}
.sv-num{font:600 11px var(--mono);color:var(--muted);text-align:right}
.sv-text{font:17px/1.55 var(--serif);color:var(--ink)}
.sv-text strong{color:var(--accent);font-weight:700}
.sv-text .join{display:inline-flex;align-items:center;justify-content:center;color:var(--slate);vertical-align:baseline;margin:0 1px}
.sv-text .join svg{width:12px;height:7px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.sv-meta{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono)}
.sv-count{padding:2px 7px;border-radius:999px;background:var(--sage-soft);color:var(--sage)}
.sv-rhyme{color:var(--slate)}
.specimen-callout{margin:16px 0 0;padding:12px 14px;background:var(--brass-soft);border-left:3px solid var(--brass);border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.55;color:var(--ink)}
.specimen-callout b{color:var(--accent);font-family:var(--serif)}
.specimen-pillars{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--folio)}
.specimen-pillars button{border:0;border-right:1px solid var(--line);background:transparent;padding:12px 10px;text-align:left;transition:background .15s}
.specimen-pillars button:last-child{border-right:0}
.specimen-pillars button:hover{background:var(--paper)}
.specimen-pillars dt,.specimen-pillars b{display:block;font:600 12px var(--serif);color:var(--ink);margin-bottom:2px}
.specimen-pillars small{display:block;font-size:11px;line-height:1.35;color:var(--muted)}

/* Landing Sections */
.l-sec{padding:48px 0;border-bottom:1px solid var(--line)}
.l-sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.l-sec-head h2{font:normal clamp(26px,3.4vw,40px)/1.1 var(--serif);letter-spacing:-.025em;margin:0}
.l-sec-head p{margin:0;color:var(--muted);max-width:420px;font-size:14.5px}
.tools-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.manual-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;position:relative}
.manual-card .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mc-num{font:600 11px var(--mono);color:var(--brass);letter-spacing:.12em}
.mc-icon{width:34px;height:34px;border-radius:8px;background:var(--folio);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.mc-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.manual-card h3{font:600 19px/1.2 var(--serif);margin:0}
.manual-card p{margin:0;font-size:13.5px;line-height:1.62;color:var(--muted)}

.manifesto{display:grid;grid-template-columns:.95fr 1.15fr;gap:36px;align-items:start;background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:34px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.manifesto:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.manifesto h2{font:normal clamp(26px,3vw,38px)/1.12 var(--serif);margin:0}
.manifesto p{font-size:15px;line-height:1.72;color:var(--muted);margin:0 0 14px}
.manifesto blockquote{margin:16px 0 18px;padding:12px 16px;background:var(--folio);border-left:2px solid var(--brass);font:italic 15px/1.6 var(--serif);color:var(--ink)}

.guides-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.guide-item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.guide-item b{font:600 15.5px var(--serif);color:var(--ink)}
.guide-item p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
.guide-item span{margin-top:auto;padding-top:6px;font:600 11.5px var(--ui);color:var(--slate)}

.faq-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:32px;align-items:start}
.faq-list details{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:10px}
.faq-list summary{cursor:pointer;font:600 15px var(--serif);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary:after{content:'+';font:400 20px/1 var(--ui);color:var(--accent)}
.faq-list details[open] summary:after{content:'−'}
.faq-list details p{margin:10px 0 0;font-size:13.5px;line-height:1.65;color:var(--muted)}

.l-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:26px;font-size:12px;color:var(--muted)}

/* ==================== TALLER SHELL ==================== */
.workshop-shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 58px);max-width:1600px;margin:0 auto}
.workshop-shell.collapsed{grid-template-columns:64px minmax(0,1fr)}
.sidebar{background:var(--folio);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.sb-head .eyebrow{font:600 10px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.sb-nav{display:grid;gap:4px}
.sb-nav button{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:9px 10px;text-align:left;font:500 13.5px var(--ui);color:var(--muted);transition:background .15s,color .15s}
.sb-nav button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb-nav button:hover{background:var(--desk);color:var(--ink)}
.sb-nav button.active{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.sb-nav button.active svg{color:var(--accent)}
.sb-count{margin-left:auto;font:600 11px var(--mono);padding:1px 7px;border-radius:999px;background:var(--desk-2);color:var(--muted)}
.sb-nav button.active .sb-count{background:var(--accent-soft);color:var(--accent)}
.sb-resources{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.sb-resources summary{cursor:pointer;font:600 10.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.sb-links{display:grid;gap:4px;margin-top:8px}
.sb-links a{font-size:12.5px;color:var(--muted);text-decoration:none;padding:5px 8px;border-radius:5px}
.sb-links a:hover{background:var(--desk);color:var(--accent)}
.workshop-shell.collapsed .sb-head .eyebrow,
.workshop-shell.collapsed .sb-label,
.workshop-shell.collapsed .sb-count,
.workshop-shell.collapsed .sb-resources{display:none}
.workshop-shell.collapsed .sb-nav button{justify-content:center;padding:10px}

.ws-main{min-width:0;padding:20px clamp(14px,2.5vw,28px) 44px;display:flex;flex-direction:column;gap:14px}

/* ==================== ESCANDIDOR (REAL UX, MANUAL CRAFT UI) ==================== */
.drawer-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.craft-drawer{background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-sm);overflow:hidden}
.craft-drawer summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;font:600 13.5px var(--serif)}
.craft-drawer summary::-webkit-details-marker{display:none}
.craft-drawer summary .d-left{display:flex;align-items:center;gap:9px}
.craft-drawer summary .d-left svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.craft-drawer summary .d-hint{font:400 12px var(--ui);color:var(--muted);display:flex;align-items:center;gap:8px;text-align:right}
.craft-drawer summary .chev{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s;flex:none}
.craft-drawer[open] summary{border-bottom:1px solid var(--line);background:var(--folio)}
.craft-drawer[open] summary .chev{transform:rotate(180deg)}
.drawer-body{padding:16px;display:grid;gap:14px}

.cfg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cfg-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.cfg-field label,.cfg-field .f-label{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cfg-field input[type=text],.cfg-field select{width:100%;border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:7px 10px;font-size:13px;min-width:0}
.cfg-field .help{font-size:11.5px;color:var(--muted);margin:0;line-height:1.45}
.cfg-checks{display:flex;flex-wrap:wrap;gap:10px 16px;padding-top:4px;border-top:1px dotted var(--line)}
.check-row{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);cursor:pointer}
.check-row input{accent-color:var(--accent)}

/* Lookup (Rimas y definicion) */
.lookup-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lookup-bar input{flex:1 1 160px;border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:7px 10px;font:14px var(--serif)}
.excluded-bar{display:flex;flex-wrap:wrap;gap:6px}
.excluded-bar:empty{display:none}
.ex-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--danger-soft);color:var(--danger)}
.ex-chip button{border:0;background:none;padding:0;font-weight:700;color:inherit;line-height:1}
.lookup-card{background:var(--folio);border:1px solid var(--line);border-radius:7px;padding:12px 14px;display:grid;gap:10px}
.lookup-def{font-size:13px;line-height:1.5;margin:0}.lookup-def b{font:600 15px var(--serif);color:var(--accent);margin-right:6px}
.lookup-group-title{font:600 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.rhyme-chips{display:flex;flex-wrap:wrap;gap:6px}
.rhyme-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:4px 10px;font:13.5px var(--serif)}
.rhyme-chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Quick bar */
.quick-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px}
.quick-left,.quick-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-group{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.q-group select{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:5px 9px;font-size:12.5px}
.scale-val{font:600 11.5px var(--mono);min-width:38px;text-align:center;color:var(--ink)}

/* Two-page open manuscript workspace (Real UX: Escritura left, Analisis right) */
.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;align-items:stretch}
.spread.mode-writing{grid-template-columns:1fr}.spread.mode-writing .analysis-pane{display:none}
.spread.mode-analysis{grid-template-columns:1fr}.spread.mode-analysis .writing-pane{display:none}
.pane{background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--folio);border-bottom:1px solid var(--line)}
.title-input{flex:1 1 180px;min-width:0;border:0;background:transparent;font:600 20px/1.2 var(--serif);color:var(--ink);padding:2px 4px;border-radius:4px}
.title-input:hover,.title-input:focus{background:var(--paper)}
.pane-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.font-select{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:5px 8px;font-size:12px;max-width:165px}
.swatch-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line-strong);background:var(--paper);display:grid;place-items:center;padding:0}
.swatch-btn i{width:16px;height:16px;border-radius:50%;background:var(--accent);display:block;border:1px solid rgba(0,0,0,.18)}

.pane-title{display:flex;align-items:center;gap:8px}
.pane-title h2{font:600 17px var(--serif);margin:0}

.stanza-sep{height:14px;display:flex;align-items:center;gap:8px;color:var(--muted);font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:6px 0}
.stanza-sep:after{content:'';flex:1;border-bottom:1px dotted var(--line)}

.sl-verse{font-family:var(--poem-font);font-size:calc(17px * var(--scale));line-height:1.7;color:var(--ink);overflow-wrap:anywhere}
.syl{display:inline}.syl.tonic{font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-decoration-thickness:2px;text-underline-offset:3px}
.syl-dash{color:var(--line-strong);padding:0 1px;font-weight:400;user-select:none}
.w-btn{border:0;background:none;padding:0 1px;border-radius:3px;font:inherit;color:inherit;cursor:pointer}

.acc-pos.ok{background:var(--sage-soft);color:var(--sage)}

 const out=[],isV=k=>VW.includes(w[k])||(w[k]==='y'&&(w.length===1||(k===w.length-1&&k>0&&VW.includes(w[k-1]))));

 while(i<w.length){

  if(w[i]==='u'&&i>0&&'qg'.includes(w[i-1])&&'eéií'.includes(w[i+1]||'')){i++;continue}

 }

function syllabify(orig,w,nuc){
 if(nuc.length<2)return [orig];

   else units.push(cl[j]);

 words.forEach((x,k)=>{
  let joined=false;
  if(k>0){
   const key=`${lineIdx}:${partOffset+k-1}`;
   const auto=isSinCandidate(words[k-1].w,x.w,rioplatense);
   const active=key in overrides?overrides[key]:auto;

}
function analyzeLine(line,lineIdx,overrides,rioplatense){
 if(!line.trim())return null;

/* ============ Parsing Target Meter & Stress ============ */
function targetCountsFor(pattern,verseIdx){
 const p=String(pattern||'').trim();if(!p)return null;
 if(p.includes('-')){const seq=p.split('-').map(x=>parseInt(x,10)).filter(Boolean);return seq.length?[seq[verseIdx%seq.length]]:null}
 const set=p.split(/\s+/).map(x=>parseInt(x,10)).filter(Boolean);
 return set.length?set:null;
}
function targetStressSet(str){return String(str||'').split(/[\s,-]+/).map(x=>parseInt(x,10)).filter(Boolean)}

/* ============ ANALYSIS RENDERER (INTERACTIVE REAL UX) ============ */
function buildAnalysisData(){
 const p=curP(),v=curV(),rawLines=v.text.split('\n');
 const analyzed=[];let verseNo=0;
 const rows=rawLines.map((line,idx)=>{
  if(!line.trim())return {blank:true,idx};
  const a=analyzeLine(line,idx,p.overrides,p.rioplatense);
  const res={blank:false,idx,verseNo:verseNo++,line,a};
  analyzed.push(a);
  return res;
 });
 const letters=computeRhymeLetters(analyzed,p.rhymeMode);
 let ai=0;
 rows.forEach(r=>{if(!r.blank)r.rhyme=letters[ai++]});
 const stanzas=v.text.trim()?v.text.trim().split(/\n\s*\n/).length:0;
 const schemeStr=letters.filter(Boolean).join(' ')||'libre';
 return {rows,stanzas,schemeStr};
}

function renderAnalysisHtml(data){
 const p=curP(),targetsStress=targetStressSet(p.stress);
 if(S.analysisMode==='text'){
  const linesTxt=data.rows.map(r=>{
   if(r.blank)return '';
   const txt=r.a.parts.map(pt=>pt.words.map((w,wi)=>{
    const sep=wi>0?(pt.boundaries[wi-1].active?'‿':' '):'';
    return sep+w.syl.map((s,si)=>si===w.si?s.toUpperCase():s).join('-');
   }).join('')).join(' / ');
   return `${txt}   [${r.a.countLabel}] (${r.a.accents.join('-')}) ${r.rhyme}`;
  }).join('\n');
  return `<pre class="analysis-text" id="analysisTextOut">${esc(linesTxt||'Escribe un poema en el panel izquierdo para ver el análisis.')}</pre>`;
 }
 let stanzaNum=1,html='<div class="analysis-body">';
 if(!data.rows.some(r=>!r.blank)){
  return '<div class="analysis-body"><p style="color:var(--muted);font:italic 15px var(--serif);padding:24px 8px">Escribí o pegá tus versos en la hoja izquierda para ver la separación silábica, las sinalefas clicables y el ritmo.</p></div>';
 }
 data.rows.forEach(r=>{
  if(r.blank){stanzaNum++;html+=`<div class="stanza-sep">Estrofa ${stanzaNum}</div>`;return}
  const a=r.a,exp=targetCountsFor(p.pattern,r.verseNo);
  const countClass=!exp?'':exp.includes(a.total)?'ok':'bad';
  const rClass=r.rhyme==='–'?'':'r'+r.rhyme.toUpperCase();
  const verseHtml=a.parts.map((pt,pi)=>{
   const wHtml=pt.words.map((w,wi)=>{
    let join='';
    if(wi>0){
     const b=pt.boundaries[wi-1];
     if(b.auto||b.key in p.overrides){
      const arc='<svg viewBox="0 0 14 8" aria-hidden="true"><path d="M1.5 1.5Q7 7.5 12.5 1.5"/></svg>';
      join=`<button type="button" class="sin-btn ${b.active?'active':'broken'}" data-sin="${b.key}" aria-label="${b.active?'Sinalefa activa':'Sinalefa rota'}" title="${b.active?'Sinalefa activa · clic para romperla':'Sinalefa rota · clic para unirla'}">${b.active?arc:'|'}</button>`;
     }else join=' ';
    }
    const sylHtml=w.syl.map((s,si)=>`<span class="syl ${w.isTonic&&si===w.si?'tonic':''}">${esc(s)}</span>`).join('<span class="syl-dash">-</span>');
    return `${join}<button type="button" class="w-btn" data-word="${esc(w.t)}" title="Consultar rimas y definición de «${esc(w.t)}»">${sylHtml}</button>`;
   }).join('');
   return (pi>0?'<span class="hemi-mark" title="Corte de hemistiquio">/</span>':'')+wHtml;
  }).join('');
  const accHtml=a.accents.map(pos=>{
   const cls=!targetsStress.length?'':targetsStress.includes(pos)?'ok':'';
   return `<span class="acc-pos ${cls}" title="Acento en sílaba ${pos}">${pos}</span>`;
  }).join('');
  const missingStress=targetsStress.filter(pos=>pos<=a.total&&!a.accents.includes(pos)).map(pos=>`<span class="acc-pos bad" title="Falta acento esperado en ${pos}">×${pos}</span>`).join('');
  html+=`<div class="scan-line ${S.selectedLine===r.idx?'selected':''}" data-sel-line="${r.idx}">
   <span class="sl-num">${r.verseNo+1}</span>
   <div class="sl-verse">${verseHtml}</div>
   <div class="sl-metrics">
    <span class="m-count ${countClass}" title="Sílabas métricas (${a.type})">${a.countLabel}</span>
    <span class="m-accents" aria-label="Posiciones de acento">${accHtml}${missingStress}</span>
    <span class="rhyme-tag ${rClass}" title="Rima ${p.rhymeMode}">${r.rhyme}</span>
   </div>
  </div>`;
 });
 html+='</div>';
 return html;
}

function renderCraftNote(data){
 const row=data.rows.find(r=>!r.blank&&r.idx===S.selectedLine)||data.rows.find(r=>!r.blank);
 if(!row)return '';
 const a=row.a,p=curP(),exp=targetCountsFor(p.pattern,row.verseNo);
 const parts=[];
 parts.push(`<strong>Verso ${row.verseNo+1}:</strong> ${a.countLabel} sílabas métricas (${a.type}${a.type==='aguda'?', suma +1':a.type==='esdrújula'?', resta −1':''}).`);
 if(exp&&!exp.includes(a.total))parts.push(`El metro configurado espera ${exp.join(' o ')}.`);
 else if(exp)parts.push(`Cumple con el metro (${exp.join(' / ')}).`);
 parts.push('Hacé clic en cualquier <strong>‿</strong> para forzar o romper una sinalefa, o en cualquier palabra para ver sus rimas.');
 return `<div class="craft-note"><span class="cn-mark" aria-hidden="true">§</span><div>${parts.join(' ')}</div></div>`;
}

function renderLookupBody(){
 const w=S.lookupWord.trim().toLowerCase();
 const excludedHtml=S.excluded.map(x=>`<span class="ex-chip">${esc(x)} <button type="button" data-unex="${esc(x)}" aria-label="Quitar ${esc(x)}">×</button></span>`).join('');
 let resHtml='<p style="margin:0;font-size:12.5px;color:var(--muted)">Escribí o hacé clic en cualquier palabra del análisis para ver su definición y rimas.</p>';
 if(w){
  const a=analyzePart(w,0,0,{},true);
  const def=DEFS[w]||'Entrada demostrativa: en el Escandidor real, la definición se consulta automáticamente en Wikcionario.';
  const cons=[],ason=[];
  if(a){
   LEXICON.forEach(cand=>{
    if(cand===w||S.excluded.includes(cand))return;
    const c=analyzePart(cand,0,0,{},true);
    if(!c)return;
    if(c.rKey===a.rKey)cons.push(cand);
    else if(c.ason===a.ason)ason.push(cand);
   });
  }
  resHtml=`<div class="lookup-card">
   <p class="lookup-def"><b>${esc(S.lookupWord)}</b>${esc(def)}</p>
   <div><p class="lookup-group-title">Rimas consonantes (${cons.length})</p><div class="rhyme-chips">${cons.slice(0,12).map(r=>`<button type="button" class="rhyme-chip" data-use-rhyme="${r}" title="Probar «${r}» al final del verso seleccionado">${r}</button>`).join('')||'<span style="font-size:12px;color:var(--muted)">Sin coincidencias en el corpus de ejemplo.</span>'}</div></div>
   <div><p class="lookup-group-title">Rimas asonantes (${ason.length})</p><div class="rhyme-chips">${ason.slice(0,10).map(r=>`<button type="button" class="rhyme-chip" data-use-rhyme="${r}">${r}</button>`).join('')||'<span style="font-size:12px;color:var(--muted)">Sin coincidencias en el corpus de ejemplo.</span>'}</div></div>
  </div>`;
 }
 return `<div class="drawer-body">
  <div class="lookup-bar">
   <input id="lookupInput" type="text" value="${esc(S.lookupWord)}" placeholder="Escribí una palabra…" aria-label="Palabra para buscar">
   <button type="button" class="btn sm" data-act="exclude-word">Evitar repetir</button>
  </div>
  <div class="excluded-bar">${excludedHtml}</div>
  ${resHtml}
 </div>`;
}

function renderEditorView(){
 const p=curP(),v=curV(),data=buildAnalysisData();
 return `
  <section class="drawer-row" aria-label="Herramientas de configuración y consulta">
   <details class="craft-drawer" id="cfgDrawer" ${S.configOpen?'open':''}>
    <summary><span class="d-left">${ic('ruler')}Configuración métrica</span><span class="d-hint">${FORMS[p.form]?.name||'Personalizada'} · ${p.pattern||'libre'} · ${p.rhymeMode}${ic('chev','chev')}</span></summary>
    <div class="drawer-body">
     <div class="cfg-grid">
      <div class="cfg-field"><label for="cfgForm">Forma o estrofa</label><select id="cfgForm">${Object.entries(FORMS).map(([k,f])=>`<option value="${k}" ${p.form===k?'selected':''}>${f.name}</option>`).join('')}</select></div>
      <div class="cfg-field"><label for="cfgPattern">Conteo silábico</label><input id="cfgPattern" type="text" value="${esc(p.pattern)}" placeholder="Ej: 11, 7-5-7-5 o 7 11"><p class="help">Guiones: secuencia. Espacios: mixto.</p></div>
      <div class="cfg-field"><label for="cfgRhyme">Tipo de rima</label><select id="cfgRhyme"><option value="asonante" ${p.rhymeMode==='asonante'?'selected':''}>Asonante</option><option value="consonante" ${p.rhymeMode==='consonante'?'selected':''}>Consonante</option><option value="palabra-final" ${p.rhymeMode==='palabra-final'?'selected':''}>Palabra final</option></select></div>
      <div class="cfg-field"><label for="cfgStress">Acento versal</label><input id="cfgStress" type="text" value="${esc(p.stress)}" placeholder="Ej: 6-10 o 7"><p class="help">Se valida en verde/rojo por verso.</p></div>
      <div class="cfg-field"><label for="cfgScheme">Esquema de rima</label><input id="cfgScheme" type="text" value="${esc(p.scheme)}" placeholder="Ej: ABBA ABBA"></div>
      <div class="cfg-field"><span class="f-label">Sinalefas</span><button type="button" class="btn sm" data-act="reset-sin">Recalcular automáticas</button><p class="help">Usá «/» en un verso para hemistiquios.</p></div>
     </div>
     <div class="cfg-checks">
      <label class="check-row"><input id="cfgRio" type="checkbox" ${p.rioplatense?'checked':''}>Y rioplatense (como en «yo»)</label>
     </div>
    </div>
   </details>

   <details class="craft-drawer" id="lookupDrawer" ${S.lookupOpen?'open':''}>
    <summary><span class="d-left">${ic('search')}Rimas y definición</span><span class="d-hint">«${esc(S.lookupWord||'elegir palabra')}» · Wikcionario y corpus${ic('chev','chev')}</span></summary>
    ${renderLookupBody()}
   </details>
  </section>

  <div class="quick-bar" aria-label="Ajustes de lectura y vista">
   <div class="quick-left">
    <span class="q-group"><span>Tamaño</span><button type="button" class="btn sm" data-act="scale-down" aria-label="Reducir texto">A−</button><span class="scale-val">${Math.round(S.scale*100)}%</span><button type="button" class="btn sm" data-act="scale-up" aria-label="Aumentar texto">A+</button></span>
    <span class="q-group"><label for="viewSelect">Vista</label><select id="viewSelect"><option value="both" ${S.viewMode==='both'?'selected':''}>Escritura + análisis</option><option value="writing" ${S.viewMode==='writing'?'selected':''}>Solo escritura</option><option value="analysis" ${S.viewMode==='analysis'?'selected':''}>Solo análisis</option></select></span>
   </div>
   <div class="quick-right">
    <span class="pill accent">${FORMS[p.form]?.name||'Medida libre'}</span>
    <span class="pill">Sin IA · Escritura propia</span>
   </div>
  </div>

  <section class="spread mode-${S.viewMode}" aria-label="Mesa de escritura y escansión">
   <article class="pane writing-pane">
    <div class="pane-head">
     <input id="poemTitleInput" class="title-input" value="${esc(p.title)}" aria-label="Título del poema">
     <div class="pane-actions">
      <select id="fontSelect" class="font-select" aria-label="Fuente del poema">${Object.entries(FONTS).map(([k,f])=>`<option value="${k}" ${S.fontKey===k?'selected':''}>${f.n}</option>`).join('')}</select>
      <button type="button" class="swatch-btn" data-act="open-color" title="Color del poema actual" aria-label="Color del poema actual"><i></i></button>
      <button type="button" class="btn icon" data-act="new-poem" title="Nuevo poema" aria-label="Nuevo poema">${ic('plus')}</button>
      <button type="button" class="btn icon" data-act="save-version" title="Guardar nueva versión (Ctrl+S)" aria-label="Guardar versión">${ic('save')}</button>
      <button type="button" class="btn sm" data-act="export-md" title="Exportar Markdown">${ic('file')}MD</button>
      <button type="button" class="btn sm" data-act="export-pdf" title="Exportar PDF">PDF</button>
     </div>
    </div>
    <div class="memory-bar">
     <span class="mem-group"><label for="poemSelect">Poema</label><select id="poemSelect">${S.poems.map((x,i)=>`<option value="${i}" ${i===S.curPoem?'selected':''}>${esc(x.title)}</option>`).join('')}</select></span>
     <span class="mem-group"><label for="verSelect">Versión</label><select id="verSelect">${p.versions.map((x,i)=>`<option value="${i}" ${i===S.curVersion?'selected':''}>${esc(x.label)} (${x.when})</option>`).join('')}</select></span>
    </div>
    <div class="capture-bar">
     <button type="button" class="btn sm" data-act="dictate">${ic('mic')}Dictar</button>
     <button type="button" class="btn sm" data-act="photo">${ic('cam')}Foto a texto</button>
     <span class="capture-status">Guardado en el navegador · ${p.versions.length} ${p.versions.length===1?'versión':'versiones'}</span>
    </div>
    <label class="sr" for="poemInput">Poema</label>
    <textarea id="poemInput" class="poem-textarea" lang="es" spellcheck="true" placeholder="Escribí o pegá tu poema acá. Usá líneas en blanco para separar estrofas y «/» para hemistiquios.">${esc(v.text)}</textarea>
   </article>

   <article class="pane analysis-pane">
    <div class="pane-head">
     <div class="pane-title"><h2>Análisis</h2><span class="pill">Estrofas ${data.stanzas}</span><span class="pill slate">Esquema ${esc(data.schemeStr)}</span></div>
     <div class="pane-actions">
      <button type="button" class="btn sm" data-act="toggle-amode">${S.analysisMode==='visual'?'Modo texto':'Vista visual'}</button>
      ${S.analysisMode==='text'?`<button type="button" class="btn sm" data-act="copy-analysis">${ic('copy')}Copiar</button>`:''}
     </div>
    </div>
    <div class="ruler-hairline" aria-hidden="true"></div>
    <div id="analysisMount" style="display:flex;flex-direction:column;flex:1">${renderAnalysisHtml(data)}${renderCraftNote(data)}</div>
   </article>
  </section>`;
}

function renderLibraryView(){
 return `
  <div class="sub-head">
   <div><p class="section-tag">Tu biblioteca</p><h1>Poemas y versiones</h1><p>Cada poema conserva su historia, su tono y sus configuraciones métricas.</p></div>
   <button type="button" class="btn primary" data-act="new-poem">${ic('plus')}Nuevo poema</button>
  </div>
  <div class="lib-grid">
   ${S.poems.map((p,i)=>`<article class="poem-card" style="--card-c:${p.color}">
    <div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><h3>${esc(p.title)}</h3><span class="pill">${p.versions.length} v.</span></div>
    <pre>${esc(p.versions[0].text.split('\n').slice(0,4).join('\n'))}</pre>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${p.tags.map(t=>`<span class="pill accent">#${esc(t)}</span>`).join('')}</div>
    <div class="poem-card-foot"><span>${esc(p.author)}</span><button type="button" class="btn sm" style="white-space:nowrap" data-open-poem="${i}">Abrir poema →</button></div>
   </article>`).join('')}
  </div>`;
}

function renderContestsView(){
 const c=S.contests[S.activeContest],p=curP(),lines=curV().text.split('\n').filter(l=>l.trim());
 const an=lines.map((l,i)=>analyzeLine(l,i,p.overrides,p.rioplatense)).filter(Boolean);
 const checks=[
  ['Extensión',`${an.length} versos (máximo ${c.maxLines})`,an.length>0&&an.length<=c.maxLines],
  ['Medida',c.meter?`Se piden versos de ${c.meter} sílabas`:'Metro libre',!c.meter||an.every(a=>a.total===c.meter)],
  ['Plica separada',c.plica?'Datos personales listos en plica aparte':'Falta completar datos de plica',c.plica]
 ];
 return `
  <div class="sub-head">
   <div><p class="section-tag">Entregas y convocatorias</p><h1>Concursos</h1><p>Compará las bases contra «${esc(p.title)}» antes de exportar tu PDF o DOCX.</p></div>
   <button type="button" class="btn" data-act="export-pdf">${ic('file')}Preparar entrega</button>
  </div>
  <div class="contest-grid">
   <div class="c-card">
    <p class="section-tag">Convocatorias guardadas</p>
    ${S.contests.map((x,i)=>`<button type="button" class="c-item ${i===S.activeContest?'on':''}" data-contest="${i}"><div><b>${esc(x.name)}</b><small>${esc(x.org)} · cierra ${x.deadline}</small></div><span class="pill ${x.status==='Enviado'?'sage':'accent'}">${x.status}</span></button>`).join('')}
   </div>
   <div class="c-card">
    <p class="section-tag">Revisión de bases</p>
    <h2 style="font:600 20px var(--serif);margin:0 0 4px">${esc(c.name)}</h2>
    <p style="margin:0;font-size:12.5px;color:var(--muted)">Poema asociado: <strong>${esc(p.title)}</strong></p>
    <ul class="checklist">${checks.map(([t,d,ok])=>`<li><span class="ck ${ok?'ok':'no'}">${ok?'✓':'!'}</span><div><strong>${t}</strong><div style="font-size:12px;color:var(--muted)">${d}</div></div></li>`).join('')}</ul>
    <button type="button" class="btn primary sm" data-ws="editor">Volver al poema para ajustar →</button>
   </div>
  </div>`;
}

function renderRemindersView(){
 return `
  <div class="sub-head">
   <div><p class="section-tag">Agenda del taller</p><h1>Recordatorios</h1><p>Cierres próximos y fechas estimadas de fallo, con exportación a calendario.</p></div>
  </div>
  <div class="c-card">
   ${S.contests.map(c=>`<div class="c-item" style="cursor:default"><div><b>${esc(c.name)}</b><small>Cierre: ${c.deadline} · ${esc(c.org)}</small></div><span class="pill ${c.status==='Enviado'?'sage':'slate'}">${c.status}</span></div>`).join('')}
  </div>`;
}

function renderWorkshop(){
 const body=S.ws==='biblioteca'?renderLibraryView():S.ws==='concursos'?renderContestsView():S.ws==='recordatorios'?renderRemindersView():renderEditorView();
 return `<div class="workshop-shell ${S.sidebarCollapsed?'collapsed':''}">
  <aside class="sidebar" aria-label="Secciones del taller">
   <div class="sb-head"><p class="eyebrow">Mi taller</p><button type="button" class="btn ghost icon" data-act="toggle-sb" aria-label="Contraer o expandir barra lateral">${ic('collapse')}</button></div>
   <nav class="sb-nav">
    <button type="button" data-ws="editor" class="${S.ws==='editor'?'active':''}">${ic('pen')}<span class="sb-label">Escandidor</span></button>
    <button type="button" data-ws="biblioteca" class="${S.ws==='biblioteca'?'active':''}">${ic('books')}<span class="sb-label">Biblioteca</span><span class="sb-count">${S.poems.length}</span></button>
    <button type="button" data-ws="concursos" class="${S.ws==='concursos'?'active':''}">${ic('trophy')}<span class="sb-label">Concursos</span><span class="sb-count">${S.contests.length}</span></button>
    <button type="button" data-ws="recordatorios" class="${S.ws==='recordatorios'?'active':''}">${ic('bell')}<span class="sb-label">Recordatorios</span><span class="sb-count">2</span></button>
   </nav>
   <details class="sb-resources" open>
    <summary>Comunidad y estudio</summary>
    <div class="sb-links">
     <a href="https://www.escritores.org/concursos/concursos-1/concursos-poesia" target="_blank" rel="noopener noreferrer">Escritores.org ↗</a>
     <a href="https://discord.gg/mSz3ER2JKR" target="_blank" rel="noopener noreferrer">Busto de Pallas ↗</a>
     <a href="https://www.lasnuevemusas.com/artes/" target="_blank" rel="noopener noreferrer">Vamos a hablar de métrica ↗</a>
    </div>
   </details>
  </aside>
  <div class="ws-main">${body}</div>
 </div>`;
}

/* ============ RENDER & LIVE UPDATES ============ */
function applyVisualPrefs(){
 document.body.classList.toggle('dark',S.dark);
 document.body.classList.toggle('tinted',!!S.poemTint);
 if(S.poemTint)document.body.style.setProperty('--poem-tint',S.poemTint);
 else document.body.style.removeProperty('--poem-tint');
 document.documentElement.style.setProperty('--scale',S.scale);
 document.documentElement.style.setProperty('--poem-font',FONTS[S.fontKey].css);
 const tb=document.getElementById('themeBtn');
 tb.innerHTML=(S.dark?ic('sun')+'Luz de día':ic('moon')+'Luz de noche');
 tb.setAttribute('aria-pressed',S.dark);
 document.querySelectorAll('.top-nav button').forEach(b=>{
  const active=(b.dataset.route==='inicio'&&S.route==='inicio')||(b.dataset.route==='taller'&&S.route==='taller'&&S.ws==='editor')||(b.dataset.ws&&S.route==='taller'&&S.ws===b.dataset.ws);
  if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
 });
}
function render(){
 applyVisualPrefs();
 document.getElementById('app').innerHTML=S.route==='inicio'?renderLanding():renderWorkshop();
 const hash=S.route+(S.route==='taller'?'/'+S.ws:'')+(S.dark?'/noche':'');
 try{history.replaceState(null,'','#'+hash)}catch{}
}
function updateAnalysisOnly(){
 const m=document.getElementById('analysisMount');if(!m)return;
 const data=buildAnalysisData();
 m.innerHTML=renderAnalysisHtml(data)+renderCraftNote(data);
 const pills=document.querySelectorAll('.analysis-pane .pane-title .pill');
 if(pills[0])pills[0].textContent='Estrofas '+data.stanzas;
 if(pills[1])pills[1].textContent='Esquema '+data.schemeStr;
}
function openColorModal(){
 const list=document.getElementById('swatchList');
 list.innerHTML=TINTS.map(t=>`<button type="button" data-pick-color="${t.hex}" class="${(S.poemTint||curP().color)===t.hex?'on':''}" style="background:${t.hex}" title="${t.name}" aria-label="${t.name}"></button>`).join('');
 document.getElementById('colorPop').hidden=false;
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(b.id==='themeBtn'){S.dark=!S.dark;render();return}
 if(d.route){S.route=d.route;if(d.route==='taller')S.ws='editor';render();window.scrollTo(0,0);return}
 if(d.ws){S.route='taller';S.ws=d.ws;render();window.scrollTo(0,0);return}
 if(d.openPoem!==undefined){S.curPoem=Number(d.openPoem);S.curVersion=0;S.selectedLine=0;S.route='taller';S.ws='editor';render();return}
 if(d.contest!==undefined){S.activeContest=Number(d.contest);render();return}
 if(d.sin){const p=curP(),cur=d.sin in p.overrides?p.overrides[d.sin]:b.classList.contains('active');p.overrides[d.sin]=!cur;updateAnalysisOnly();toast(!cur?'Sinalefa forzada en esta unión.':'Sinalefa rota (hiato) en esta unión.');return}
 if(d.word){S.lookupWord=d.word;S.lookupOpen=true;render();toast('Consultando «'+d.word+'».');return}
 if(d.unex){S.excluded=S.excluded.filter(x=>x!==d.unex);render();return}
 if(d.useRhyme){
  const v=curV(),ls=v.text.split('\n'),i=Math.min(S.selectedLine,ls.length-1);
  if(ls[i]&&ls[i].trim()){
   ls[i]=ls[i].replace(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*)$/,(m,w,punct)=>(w[0]!==w[0].toLowerCase()?d.useRhyme[0].toUpperCase()+d.useRhyme.slice(1):d.useRhyme)+punct);
   v.text=ls.join('\n');render();toast('Probando «'+d.useRhyme+'» en el verso '+(i+1)+'.');
  }
  return;
 }
 if(d.pickColor){S.poemTint=d.pickColor;curP().color=d.pickColor;applyVisualPrefs();openColorModal();return}
 const a=d.act;if(!a)return;
 if(a==='toggle-sb'){S.sidebarCollapsed=!S.sidebarCollapsed;render();return}
 if(a==='scale-down'){S.scale=Math.max(.85,+(S.scale-.1).toFixed(2));render();return}
 if(a==='scale-up'){S.scale=Math.min(1.35,+(S.scale+.1).toFixed(2));render();return}
 if(a==='toggle-amode'){S.analysisMode=S.analysisMode==='visual'?'text':'visual';render();return}
 if(a==='copy-analysis'){const txt=document.getElementById('analysisTextOut')?.textContent||'';try{navigator.clipboard.writeText(txt)}catch{}toast('Análisis copiado en modo texto.');return}
 if(a==='reset-sin'){curP().overrides={};updateAnalysisOnly();toast('Sinalefas automáticas restablecidas.');return}
 if(a==='exclude-word'){const w=S.lookupWord.trim().toLowerCase();if(w&&!S.excluded.includes(w)){S.excluded.push(w);render();toast('«'+w+'» añadida a evitar repetir.')}return}
 if(a==='save-version'){const p=curP(),n=p.versions.length+1;p.versions.unshift({label:'Versión '+n,when:new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}),text:curV().text});S.curVersion=0;render();toast('Versión guardada en el historial.');return}
 if(a==='new-poem'){S.poems.unshift({id:'p'+Date.now(),title:'Sin título',author:'Borrador propio',color:'#ad4227',tags:['borrador'],form:'custom',pattern:'',rhymeMode:'asonante',scheme:'',stress:'',rioplatense:true,overrides:{},versions:[{label:'Versión actual',when:'ahora',text:''}]});S.curPoem=0;S.curVersion=0;S.selectedLine=0;S.route='taller';S.ws='editor';render();document.getElementById('poemInput')?.focus();return}
 if(a==='open-color'){openColorModal();return}
 if(a==='reset-color'){S.poemTint=null;applyVisualPrefs();document.getElementById('colorPop').hidden=true;return}
 if(a==='close-color'){document.getElementById('colorPop').hidden=true;return}
 if(a==='export-md'){const blob=new Blob([`# ${curP().title}\n\n${curV().text}\n`],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),lk=document.createElement('a');lk.href=url;lk.download='poema.md';lk.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Poema descargado en Markdown.');return}
 if(a==='export-pdf'){toast('En el Escandidor real, esto genera el PDF listo para imprimir o presentar.');return}
 if(a==='dictate'){toast('En el Escandidor real, aquí se inicia el dictado por voz en español.');return}
 if(a==='photo'){toast('En el Escandidor real, aquí se extrae el texto desde una foto del cuaderno.');return}
});

document.addEventListener('click',e=>{
 const row=e.target.closest('[data-sel-line]');
 if(row&&!e.target.closest('button')){S.selectedLine=Number(row.dataset.selLine);updateAnalysisOnly()}
});

document.addEventListener('toggle',e=>{
 if(e.target.id==='cfgDrawer')S.configOpen=e.target.open;
 if(e.target.id==='lookupDrawer')S.lookupOpen=e.target.open;
},true);

document.addEventListener('input',e=>{
 const el=e.target,p=curP();
 if(el.id==='poemInput'){curV().text=el.value;updateAnalysisOnly();return}
 if(el.id==='poemTitleInput'){p.title=el.value||'Sin título';const sel=document.getElementById('poemSelect');if(sel&&sel.options[S.curPoem])sel.options[S.curPoem].textContent=p.title;return}
 if(el.id==='cfgPattern'){p.pattern=el.value;p.form='custom';updateAnalysisOnly();return}
 if(el.id==='cfgStress'){p.stress=el.value;updateAnalysisOnly();return}
 if(el.id==='cfgScheme'){p.scheme=el.value;return}
 if(el.id==='lookupInput'){S.lookupWord=el.value;const body=document.querySelector('#lookupDrawer .drawer-body');if(body){const pos=el.selectionStart;body.outerHTML=renderLookupBody();const ni=document.getElementById('lookupInput');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos)}catch{}}}return}
});

document.addEventListener('change',e=>{
 const el=e.target,p=curP();
 if(el.id==='cfgForm'){const f=FORMS[el.value];if(f){p.form=el.value;if(el.value!=='custom'){p.pattern=f.pattern;p.rhymeMode=f.rhyme;p.scheme=f.scheme;p.stress=f.stress}render()}return}
 if(el.id==='cfgRhyme'){p.rhymeMode=el.value;render();return}
 if(el.id==='cfgRio'){p.rioplatense=el.checked;updateAnalysisOnly();return}
 if(el.id==='viewSelect'){S.viewMode=el.value;render();return}
 if(el.id==='fontSelect'){S.fontKey=el.value;applyVisualPrefs();return}
 if(el.id==='poemSelect'){S.curPoem=Number(el.value);S.curVersion=0;S.selectedLine=0;render();return}
 if(el.id==='verSelect'){S.curVersion=Number(el.value);render();return}
});

function fromHash(){
 const parts=location.hash.slice(1).split('/');
 if(parts.includes('noche'))S.dark=true;
 if(parts[0]==='inicio')S.route='inicio';
 else if(parts[0]==='taller'){S.route='taller';if(['editor','biblioteca','concursos','recordatorios'].includes(parts[1]))S.ws=parts[1]}
 render();
}
fromHash();
</script>
</body>
</html>
